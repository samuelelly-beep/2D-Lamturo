<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Lamturo GIS</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html,body,#map{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* =========================
   HEADER
========================= */

#head{
    position:absolute;
    z-index:1000;
    left:42px;
    top:8px;
    background:#fff;
    padding:5px 9px;
    border-radius:9px;
    box-shadow:0 2px 8px #0004;
    display:flex;
    align-items:center;
}

#head img{
    width:42px;
    height:42px;
    object-fit:contain;
    margin-right:7px;
}

#t{
    font-weight:bold;
    color:#12345a;
    font-size:16px;
}

#s{
    font-size:9px;
    color:#4a8f45;
}

/* =========================
   CONTROL
========================= */

#ctl{
    position:absolute;
    z-index:1000;
    right:8px;
    top:8px;
    width:155px;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.p{
    background:#fff;
    border-radius:8px;
    box-shadow:0 2px 8px #0004;
    overflow:hidden;
}

.h{
    border:0;
    background:#fff;
    width:100%;
    padding:9px;
    text-align:left;
    font-weight:bold;
    color:#12345a;
    cursor:pointer;
}

.c{
    display:none;
    padding:6px;
    border-top:1px solid #ddd;
}

.p.open .c{
    display:block;
}

.r{
    display:flex;
    align-items:center;
    gap:6px;
    padding:5px 1px;
    font-size:11px;
}

.ln{
    display:inline-block;
    width:22px;
    height:3px;
}

.src{
    background:red;
}

.rec{
    background:#003f9e;
}

.pt{
    width:11px;
    height:11px;
    border-radius:50%;
    display:inline-block;
}

.sp{
    background:red;
}

.tr{
    background:#06f;
}

.b{
    width:100%;
    padding:6px;
    margin-bottom:4px;
    background:white;
    border:1px solid #ccc;
    border-radius:5px;
    text-align:left;
    font-size:11px;
    cursor:pointer;
}

/* =========================
   POPUP
========================= */

.at{
    border-collapse:collapse;
    font-size:12px;
}

.at td{
    padding:4px;
    border-bottom:1px solid #ddd;
    vertical-align:top;
}

.at td:first-child{
    font-weight:bold;
    color:#555;
}

.leaflet-popup-content{
    max-height:330px;
    overflow:auto;
}

/* =========================
   SP / TRAS LABEL
========================= */

.tile-label{
    white-space:nowrap;
    font-family:Arial,sans-serif;

    /* FONT TETAP */
    font-size:11px;
    font-weight:bold;

    line-height:14px;

    padding:1px 3px;

    border:1px solid;
    border-radius:2px;

    background:rgba(255,255,255,.90);

    box-shadow:none;

    display:inline-block;

    pointer-events:auto;
}

/* SP */

.sp-label{
    color:red;
    border-color:red;
}

/* TRAS */

.tras-label{
    color:#06f;
    border-color:#06f;
}

/* GARIS GENAP */

.label-even{
    transform:none;
}

/* GARIS GANJIL */

.label-odd{
    transform:rotate(90deg);
    transform-origin:center center;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    #ctl{
        width:145px;
    }

    #t{
        font-size:14px;
    }

    #head img{
        width:37px;
        height:37px;
    }

    .tile-label{
        font-size:11px;
    }
}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div id="head">

    <img src="logo.png">

    <div>
        <div id="t">LAMTURO GIS</div>
        <div id="s">WEB GIS SEISMIK 2D</div>
    </div>

</div>


<!-- MAP -->

<div id="map"></div>


<!-- =========================
     CONTROL PANEL
========================= -->

<div id="ctl">

    <div class="p">

        <button class="h" onclick="op(this)">
            📚 LAYERS ▼
        </button>

        <div class="c">

            <label class="r">
                <input
                    id="srcOn"
                    type="checkbox"
                    checked
                    onchange="line('src')">
                <span class="ln src"></span>
                Source Line
            </label>

            <label class="r">
                <input
                    id="recOn"
                    type="checkbox"
                    checked
                    onchange="line('rec')">
                <span class="ln rec"></span>
                Receiver Line
            </label>

            <label class="r">
                <input
                    id="spOn"
                    type="checkbox"
                    onchange="points()">
                <span class="pt sp"></span>
                East SP
            </label>

            <label class="r">
                <input
                    id="trOn"
                    type="checkbox"
                    onchange="points()">
                <span class="pt tr"></span>
                East TRAS
            </label>

        </div>

    </div>


    <div class="p">

        <button class="h" onclick="op(this)">
            🗺️ BASEMAP ▼
        </button>

        <div class="c">

            <button class="b" onclick="base('sat')">
                🛰️ Satellite
            </button>

            <button class="b" onclick="base('hyb')">
                🌍 Hybrid
            </button>

            <button class="b" onclick="base('road')">
                🗺️ Roadmap
            </button>

        </div>

    </div>


    <div class="p">

        <button class="h" onclick="locate()">
            📍 POSISI SAYA
        </button>

    </div>

</div>


<script>

/* =========================================================
   KONFIGURASI TILE
========================================================= */

const GRID_SIZE = 0.02;

/*
 Struktur GitHub:

 tiles/
   sp_1/
      X/
         Y/
            data.geojson

   sp_2/
      X/
         Y/
            data.geojson

   tras_1/
      X/
         Y/
            data.geojson

   tras_2/
      X/
         Y/
            data.geojson
*/


/* =========================================================
   VARIABEL
========================================================= */

let map;

let src;
let rec;

let spL;
let trL;

let sat;
let hyb;
let road;


/* cache tile */

const cache = {

    sp:new Map(),
    tr:new Map()

};


/* =========================================================
   INIT MAP
========================================================= */

function init(){

    map = L.map('map',{
        maxZoom:20
    }).setView(
        [-7.2,112.4],
        10
    );


    /* =========================
       PANES
    ========================= */

    ['rec','src','tr','sp']
    .forEach((n,i)=>{

        map.createPane(n);

        map.getPane(n).style.zIndex =
            400 + i*50;

    });


    /* =========================
       BASEMAP
    ========================= */

    sat = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {
            attribution:'Tiles © Esri',
            maxZoom:20
        }
    ).addTo(map);


    road = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:'© OpenStreetMap',
            maxZoom:20
        }
    );


    hyb = L.layerGroup([

        sat,

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                opacity:.25,
                maxZoom:20
            }
        )

    ]);


    /* =========================
       LINE
    ========================= */

    src = L.geoJSON(null,{
        pane:'src',
        style:{
            color:'red',
            weight:2
        }
    }).addTo(map);


    rec = L.geoJSON(null,{
        pane:'rec',
        style:{
            color:'#003f9e',
            weight:1.5
        }
    }).addTo(map);


    /* =========================
       POINT LAYERS
    ========================= */

    spL = L.layerGroup();

    trL = L.layerGroup();


    /* =========================
       LOAD LINE
    ========================= */

    fetch('east_source_line.geojson')
    .then(r=>r.json())
    .then(d=>src.addData(d))
    .catch(e=>console.warn(
        'Source Line:',
        e
    ));


    fetch('east_receiver_line.geojson')
    .then(r=>r.json())
    .then(d=>rec.addData(d))
    .catch(e=>console.warn(
        'Receiver Line:',
        e
    ));


    /* =========================
       LOAD POINTS
    ========================= */

    map.on(
        'moveend zoomend',
        ()=>{

            clearTimeout(window.tm);

            window.tm =
                setTimeout(
                    points,
                    120
                );

        }
    );

}


/* =========================================================
   TILE INDEX
========================================================= */

function tileIndex(value){

    return Math.floor(
        value / GRID_SIZE
    );

}


/* =========================================================
   TILE RANGE
========================================================= */

function getTileRange(){

    const b = map.getBounds();

    const west  = b.getWest();
    const east  = b.getEast();

    const south = b.getSouth();
    const north = b.getNorth();


    const minX =
        tileIndex(west);

    const maxX =
        tileIndex(east);

    const minY =
        tileIndex(south);

    const maxY =
        tileIndex(north);


    return {
        minX,
        maxX,
        minY,
        maxY
    };

}


/* =========================================================
   LOAD TILE
========================================================= */

async function loadTile(
    source,
    x,
    y,
    layer,
    kind
){

    const key =
        `${source}/${x}/${y}`;


    /* sudah cache */

    if(cache[kind].has(key)){

        const features =
            cache[kind].get(key);

        features.forEach(
            f=>addPoint(
                layer,
                f,
                kind
            )
        );

        return;

    }


    const url =
        `tiles/${source}/${x}/${y}/data.geojson`;


    try{

        const r =
            await fetch(url);


        if(!r.ok)
            return;


        const d =
            await r.json();


        if(!d.features)
            return;


        cache[kind].set(
            key,
            d.features
        );


        d.features.forEach(
            f=>addPoint(
                layer,
                f,
                kind
            )
        );


    }catch(e){

        console.warn(
            'Tile gagal:',
            url,
            e
        );

    }

}


/* =========================================================
   PILIH SOURCE TILE
========================================================= */

function getSources(kind){

    if(kind === 'sp'){

        return [
            'sp_1',
            'sp_2'
        ];

    }

    return [
        'tras_1',
        'tras_2'
    ];

}


/* =========================================================
   LOAD SEMUA TILE AREA
========================================================= */

async function points(){

    spL.clearLayers();

    trL.clearLayers();


    /* =========================
       MINIMUM ZOOM
    ========================= */

    if(map.getZoom() < 18){

        map.removeLayer(spL);
        map.removeLayer(trL);

        return;

    }


    const range =
        getTileRange();


    const jobs = [];


    /* =========================
       SP
    ========================= */

    if(
        document
        .getElementById('spOn')
        .checked
    ){

        for(
            let x=range.minX;
            x<=range.maxX;
            x++
        ){

            for(
                let y=range.minY;
                y<=range.maxY;
                y++
            ){

                for(
                    const source
                    of getSources('sp')
                ){

                    jobs.push(
                        loadTile(
                            source,
                            x,
                            y,
                            spL,
                            'sp'
                        )
                    );

                }

            }

        }

    }


    /* =========================
       TRAS
    ========================= */

    if(
        document
        .getElementById('trOn')
        .checked
    ){

        for(
            let x=range.minX;
            x<=range.maxX;
            x++
        ){

            for(
                let y=range.minY;
                y<=range.maxY;
                y++
            ){

                for(
                    const source
                    of getSources('tr')
                ){

                    jobs.push(
                        loadTile(
                            source,
                            x,
                            y,
                            trL,
                            'tr'
                        )
                    );

                }

            }

        }

    }


    /* =========================
       LOAD PARALEL
    ========================= */

    await Promise.all(jobs);


    /* =========================
       DISPLAY
    ========================= */

    if(
        document
        .getElementById('spOn')
        .checked
    ){

        spL.addTo(map);

    }else{

        map.removeLayer(spL);

    }


    if(
        document
        .getElementById('trOn')
        .checked
    ){

        trL.addTo(map);

    }else{

        map.removeLayer(trL);

    }

}


/* =========================================================
   AMBIL NAMA LINE
========================================================= */

function getLineName(p){

    const keys =
        Object.keys(p || {});


    const candidates = [

        'LINE',
        'Line',
        'line',

        'LINTASAN',
        'Lintasan',
        'lintasan',

        'RECEIVER',
        'Receiver',
        'receiver',

        'SOURCE',
        'Source',
        'source',

        'R'

    ];


    for(
        const k of candidates
    ){

        if(
            p &&
            p[k] !== undefined &&
            p[k] !== null &&
            String(p[k]).trim() !== ''
        ){

            return String(
                p[k]
            ).trim();

        }

    }


    /* cari nilai property
       yang terlihat seperti R111 */

    for(
        const k of keys
    ){

        const v =
            String(
                p[k] ?? ''
            ).trim();


        const m =
            v.match(
                /^R\s*\d+$/i
            );


        if(m)
            return v;

    }


    return '';

}


/* =========================================================
   CARI NOMOR SP / TRAS
========================================================= */

function getPointNumber(
    p,
    kind
){

    const keys =
        Object.keys(p || {});


    const wanted =
        kind === 'sp'
        ? [
            'SP',
            'Sp',
            'sp',
            'SP_NO',
            'SPNO',
            'POINT',
            'Point'
        ]
        : [
            'TRAS',
            'Tras',
            'tras',
            'TRAS_NO',
            'TRASNO',
            'POINT',
            'Point'
        ];


    for(
        const k of wanted
    ){

        if(
            p[k] !== undefined &&
            p[k] !== null &&
            String(p[k]).trim() !== ''
        ){

            return String(
                p[k]
            ).trim();

        }

    }


    /* fallback cari key
       yang mengandung SP/TRAS */

    for(
        const k of keys
    ){

        const kl =
            k.toLowerCase();


        if(
            kind === 'sp' &&
            kl.includes('sp')
        ){

            return String(
                p[k] ?? ''
            ).trim();

        }


        if(
            kind === 'tr' &&
            kl.includes('tras')
        ){

            return String(
                p[k] ?? ''
            ).trim();

        }

    }


    return '';

}


/* =========================================================
   CEK GANJIL / GENAP
========================================================= */

function isOddLine(
    lineName
){

    const m =
        String(
            lineName || ''
        ).match(
            /\d+/
        );


    if(!m)
        return false;


    const n =
        parseInt(
            m[0],
            10
        );


    return n % 2 === 1;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(s){

    return String(s)
    .replace(
        /[&<>"']/g,
        m=>({

            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#039;'

        }[m])
    );

}


/* =========================================================
   LABEL
========================================================= */

function createLabel(
    lineName,
    kind,
    number
){

    const line =
        lineName || '';


    const num =
        number || '';


    const text =
        `${line} ${kind === 'sp' ? 'SP' : 'TRAS'} ${num}`;


    const odd =
        isOddLine(line);


    const typeClass =
        kind === 'sp'
        ? 'sp-label'
        : 'tras-label';


    const rotationClass =
        odd
        ? 'label-odd'
        : 'label-even';


    return `
        <div class="
            tile-label
            ${typeClass}
            ${rotationClass}
        ">
            ${esc(text)}
        </div>
    `;

}


/* =========================================================
   TAMBAH POINT
========================================================= */

function addPoint(
    layer,
    f,
    kind
){

    if(
        !f ||
        !f.geometry ||
        f.geometry.type !== 'Point'
    )
        return;


    const [
        x,
        y
    ] =
        f.geometry.coordinates;


    /* =========================
       HANYA POINT DALAM VIEW
    ========================= */

    if(
        !map
        .getBounds()
        .contains([y,x])
    )
        return;


    const p =
        f.properties || {};


    const lineName =
        getLineName(p);


    const number =
        getPointNumber(
            p,
            kind
        );


    /* =========================
       POINT
    ========================= */

    const marker =
        L.circleMarker(
            [y,x],
            {

                pane:
                    kind === 'sp'
                    ? 'sp'
                    : 'tr',

                radius:
                    kind === 'sp'
                    ? 3.2
                    : 2.7,

                color:
                    kind === 'sp'
                    ? 'red'
                    : '#06f',

                fillColor:
                    kind === 'sp'
                    ? 'red'
                    : '#06f',

                fillOpacity:1,

                weight:.7

            }
        );


    /* =========================
       POPUP SEMUA ATRIBUT
    ========================= */

    let h =
        `<b>${
            kind === 'sp'
            ? '🔴 SP'
            : '🔵 TRAS'
        }</b>`;


    h +=
        '<table class="at">';


    Object.keys(p)
    .forEach(q=>{

        const v =
            p[q] ?? '';


        h += `
            <tr>
                <td>${esc(q)}</td>
                <td>${esc(String(v))}</td>
            </tr>
        `;

    });


    h += `
        <tr>
            <td>Latitude</td>
            <td>${y.toFixed(7)}</td>
        </tr>

        <tr>
            <td>Longitude</td>
            <td>${x.toFixed(7)}</td>
        </tr>
    `;


    h +=
        '</table>';


    marker.bindPopup(
        h,
        {
            maxWidth:340
        }
    );


    marker.addTo(layer);


    /* =========================
       LABEL
    ========================= */

    if(
        lineName &&
        number !== ''
    ){

        const icon =
            L.divIcon({

                className:'',
                html:
                    createLabel(
                        lineName,
                        kind,
                        number
                    ),

                iconSize:null,

                iconAnchor:[
                    0,
                    0
                ]

            });


        const label =
            L.marker(
                [y,x],
                {
                    pane:
                        kind === 'sp'
                        ? 'sp'
                        : 'tr',

                    icon:icon,

                    interactive:false
                }
            );


        label.addTo(layer);

    }

}


/* =========================================================
   TOGGLE LINE
========================================================= */

function line(k){

    const l =
        k === 'src'
        ? src
        : rec;


    const on =
        document
        .getElementById(
            k === 'src'
            ? 'srcOn'
            : 'recOn'
        )
        .checked;


    if(on)
        l.addTo(map);

    else
        map.removeLayer(l);

}


/* =========================================================
   BASEMAP
========================================================= */

function base(k){

    [
        sat,
        hyb,
        road
    ]
    .forEach(
        x=>map.removeLayer(x)
    );


    if(k === 'sat')
        sat.addTo(map);

    if(k === 'hyb')
        hyb.addTo(map);

    if(k === 'road')
        road.addTo(map);

}


/* =========================================================
   PANEL
========================================================= */

function op(b){

    b.parentElement
     .classList
     .toggle('open');

}


/* =========================================================
   POSISI SAYA
========================================================= */

function locate(){

    if(
        !navigator.geolocation
    ){

        alert(
            'Browser tidak mendukung lokasi.'
        );

        return;

    }


    navigator
    .geolocation
    .getCurrentPosition(

        p=>{

            map.setView(
                [
                    p.coords.latitude,
                    p.coords.longitude
                ],
                17
            );

        },

        ()=>{

            alert(
                'Izin lokasi tidak tersedia'
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
