<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Lamturo GIS</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
}

/* =========================
   HEADER
========================= */

#header {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 1000;

    display: flex;
    align-items: center;

    background: white;
    padding: 10px 18px 10px 10px;

    border-radius: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.25);
}

#header img {
    width: 55px;
    height: 55px;
    object-fit: contain;
    margin-right: 10px;
}

#header-title {
    font-size: 22px;
    font-weight: bold;
    color: #12345a;
}

#header-subtitle {
    font-size: 13px;
    color: #4b9650;
    margin-top: 3px;
}


/* =========================
   CONTROL PANEL
========================= */

.control-panel {

    background: white;

    border-radius: 10px;

    margin: 8px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.25);

    overflow: hidden;

    min-width: 190px;
}

.control-title {

    padding: 10px 13px;

    font-size: 14px;
    font-weight: bold;

    color: #12345a;

    cursor: pointer;

    user-select: none;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.control-content {

    padding: 8px 10px 10px 10px;
}

.control-panel.collapsed
.control-content {

    display: none;
}


/* =========================
   LAYER CHECKBOX
========================= */

.layer-row {

    display: flex;
    align-items: center;

    padding: 6px 2px;

    font-size: 13px;
}

.layer-row input {

    margin-right: 8px;

    width: 16px;
    height: 16px;
}

.layer-symbol {

    width: 12px;
    height: 12px;

    border-radius: 50%;

    display: inline-block;

    margin-right: 7px;
}

.symbol-red {
    background: #e53935;
}

.symbol-blue {
    background: #1976d2;
}

.symbol-source {
    background: #e53935;
}

.symbol-receiver {
    background: #1565c0;
}


/* =========================
   BASEMAP BUTTON
========================= */

.map-button {

    display: block;

    width: 100%;

    margin: 4px 0;

    padding: 8px;

    border: 1px solid #ccc;

    border-radius: 6px;

    background: white;

    cursor: pointer;

    font-size: 13px;
}

.map-button:hover {
    background: #f1f1f1;
}


/* =========================
   POSITION BUTTON
========================= */

.location-button {

    width: 100%;

    padding: 9px;

    border: none;

    border-radius: 6px;

    background: #1565c0;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   INFO WINDOW
========================= */

.attribute-table {

    border-collapse: collapse;

    width: 100%;

    min-width: 250px;

    font-size: 12px;
}

.attribute-table th {

    background: #12345a;

    color: white;

    text-align: left;

    padding: 6px;

    border: 1px solid #ddd;

    white-space: nowrap;
}

.attribute-table td {

    padding: 6px;

    border: 1px solid #ddd;

    word-break: break-word;
}

.attribute-table tr:nth-child(even) {
    background: #f5f5f5;
}

.info-title {

    font-size: 15px;

    font-weight: bold;

    color: #12345a;

    margin-bottom: 8px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    #header {

        top: 8px;
        left: 8px;

        padding: 6px 10px 6px 6px;

        border-radius: 9px;
    }

    #header img {

        width: 42px;
        height: 42px;
    }

    #header-title {
        font-size: 16px;
    }

    #header-subtitle {
        font-size: 10px;
    }

    .control-panel {

        min-width: 155px;

        margin: 4px;

        border-radius: 8px;
    }

    .control-title {

        padding: 9px;

        font-size: 12px;
    }

    .control-content {

        padding: 6px 8px;
    }

    .layer-row {

        font-size: 12px;

        padding: 5px 0;
    }

}

</style>


<!-- GOOGLE MAPS -->

<script
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtUgo1bsWsw0XXlDNvReYeCwohPiDc79&callback=initMap"
async
defer>
</script>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div id="header">

    <img src="logo.png" alt="Lamturo GIS">

    <div>

        <div id="header-title">
            LAMTURO GIS
        </div>

        <div id="header-subtitle">
            WEB GIS SEISMIK 2D
        </div>

    </div>

</div>


<!-- =========================
     MAP
========================= -->

<div id="map"></div>


<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let map;

let sourceLayer;
let receiverLayer;

let spLayer;
let trasLayer;

let myLocationMarker = null;

let infoWindow;


/* =====================================================
   INITIALIZE MAP
===================================================== */

function initMap() {

    map = new google.maps.Map(
        document.getElementById("map"),
        {

            center: {
                lat: -7.25,
                lng: 112.75
            },

            zoom: 9,

            mapTypeId: "hybrid",

            mapTypeControl: false,

            fullscreenControl: true,

            streetViewControl: false

        }
    );


    infoWindow = new google.maps.InfoWindow();


    /* ===============================================
       SOURCE LINE
    =============================================== */

    sourceLayer = new google.maps.Data();

    sourceLayer.setMap(map);

    sourceLayer.setStyle({

        strokeColor: "#ff0000",

        strokeWeight: 1.2,

        strokeOpacity: 0.85,

        zIndex: 20

    });


    sourceLayer.loadGeoJson(
        "east_source_line.geojson"
    );


    /* ===============================================
       RECEIVER LINE
    =============================================== */

    receiverLayer = new google.maps.Data();

    receiverLayer.setMap(map);

    receiverLayer.setStyle({

        strokeColor: "#00008b",

        strokeWeight: 1.0,

        strokeOpacity: 0.85,

        zIndex: 10

    });


    receiverLayer.loadGeoJson(
        "east_receiver_line.geojson"
    );


    /* ===============================================
       EAST SP
       MERAH
       DI ATAS TRAS
    =============================================== */

    spLayer = new google.maps.Data();

    /*
       DEFAULT OFF
    */

    spLayer.setMap(null);


    spLayer.setStyle({

        icon: {

            path: google.maps.SymbolPath.CIRCLE,

            scale: 3.5,

            fillColor: "#ff0000",

            fillOpacity: 1,

            strokeColor: "#ffffff",

            strokeWeight: 0.8

        },

        zIndex: 200

    });


    spLayer.loadGeoJson(
        "east_sp.geojson"
    );


    /* ===============================================
       EAST TRAS
       BIRU
    =============================================== */

    trasLayer = new google.maps.Data();

    /*
       DEFAULT OFF
    */

    trasLayer.setMap(null);


    trasLayer.setStyle({

        icon: {

            path: google.maps.SymbolPath.CIRCLE,

            scale: 3.0,

            fillColor: "#0066ff",

            fillOpacity: 1,

            strokeColor: "#ffffff",

            strokeWeight: 0.6

        },

        zIndex: 100

    });


    trasLayer.loadGeoJson(
        "east_tras.geojson"
    );


    /* ===============================================
       CLICK SP
    =============================================== */

    spLayer.addListener(
        "click",
        function(event) {

            showFeatureInformation(
                event.feature,
                event.latLng,
                "SP"
            );

        }
    );


    /* ===============================================
       CLICK TRAS
    =============================================== */

    trasLayer.addListener(
        "click",
        function(event) {

            showFeatureInformation(
                event.feature,
                event.latLng,
                "TRAS"
            );

        }
    );


    /* ===============================================
       CLICK SOURCE LINE
    =============================================== */

    sourceLayer.addListener(
        "click",
        function(event) {

            showFeatureInformation(
                event.feature,
                event.latLng,
                "SOURCE LINE"
            );

        }
    );


    /* ===============================================
       CLICK RECEIVER LINE
    =============================================== */

    receiverLayer.addListener(
        "click",
        function(event) {

            showFeatureInformation(
                event.feature,
                event.latLng,
                "RECEIVER LINE"
            );

        }
    );


    /* ===============================================
       CONTROLS
    =============================================== */

    createLayerPanel();

    createBasemapPanel();

    createLocationPanel();

}


/* =====================================================
   FEATURE ATTRIBUTE TABLE
===================================================== */

function showFeatureInformation(
    feature,
    latLng,
    featureType
) {

    let html = "";

    html +=
        '<div class="info-title">' +
        featureType +
        "</div>";

    html +=
        '<table class="attribute-table">';


    /*
       GET ALL PROPERTIES
    */

    let hasProperties = false;

    feature.forEachProperty(
        function(value, key) {

            hasProperties = true;

            if (
                value === null ||
                value === undefined
            ) {

                value = "";

            }

            html += "<tr>";

            html +=
                "<th>" +
                escapeHtml(key) +
                "</th>";

            html +=
                "<td>" +
                escapeHtml(String(value)) +
                "</td>";

            html += "</tr>";

        }
    );


    /*
       COORDINATES
    */

    if (latLng) {

        html += "<tr>";

        html +=
            "<th>Latitude</th>";

        html +=
            "<td>" +
            latLng.lat().toFixed(8) +
            "</td>";

        html += "</tr>";


        html += "<tr>";

        html +=
            "<th>Longitude</th>";

        html +=
            "<td>" +
            latLng.lng().toFixed(8) +
            "</td>";

        html += "</tr>";

    }


    if (!hasProperties) {

        html += "<tr>";

        html +=
            "<td colspan='2'>" +
            "Tidak ada atribut pada data." +
            "</td>";

        html += "</tr>";

    }


    html += "</table>";


    infoWindow.setContent(html);

    infoWindow.setPosition(latLng);

    infoWindow.open(map);

}


/* =====================================================
   ESCAPE HTML
   AGAR DATA ATRIBUT AMAN DITAMPILKAN
===================================================== */

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   LAYER PANEL
===================================================== */

function createLayerPanel() {

    const panel =
        document.createElement("div");

    panel.className =
        "control-panel";


    const title =
        document.createElement("div");

    title.className =
        "control-title";

    title.innerHTML =
        "<span>📡 LAYERS</span>" +
        "<span>▼</span>";


    const content =
        document.createElement("div");

    content.className =
        "control-content";


    title.onclick = function() {

        panel.classList.toggle(
            "collapsed"
        );

    };


    /* ===============================================
       SOURCE
    =============================================== */

    addLayerCheckbox(
        content,
        "Source Line",
        sourceLayer,
        true,
        "symbol-source"
    );


    /* ===============================================
       RECEIVER
    =============================================== */

    addLayerCheckbox(
        content,
        "Receiver Line",
        receiverLayer,
        true,
        "symbol-receiver"
    );


    /* ===============================================
       SP
    =============================================== */

    addLayerCheckbox(
        content,
        "SP",
        spLayer,
        false,
        "symbol-red"
    );


    /* ===============================================
       TRAS
    =============================================== */

    addLayerCheckbox(
        content,
        "TRAS",
        trasLayer,
        false,
        "symbol-blue"
    );


    panel.appendChild(title);

    panel.appendChild(content);


    map.controls[
        google.maps.ControlPosition.TOP_RIGHT
    ].push(panel);

}


/* =====================================================
   ADD CHECKBOX
===================================================== */

function addLayerCheckbox(
    parent,
    label,
    layer,
    checked,
    symbolClass
) {

    const row =
        document.createElement("label");

    row.className =
        "layer-row";


    const checkbox =
        document.createElement("input");

    checkbox.type = "checkbox";

    checkbox.checked = checked;


    /*
       SET INITIAL STATE
    */

    if (!checked) {

        layer.setMap(null);

    }


    const symbol =
        document.createElement("span");

    symbol.className =
        "layer-symbol " +
        symbolClass;


    const text =
        document.createElement("span");

    text.textContent =
        label;


    checkbox.onchange =
        function() {

            if (this.checked) {

                layer.setMap(map);

            } else {

                layer.setMap(null);

            }

        };


    row.appendChild(checkbox);

    row.appendChild(symbol);

    row.appendChild(text);

    parent.appendChild(row);

}


/* =====================================================
   BASEMAP PANEL
===================================================== */

function createBasemapPanel() {

    const panel =
        document.createElement("div");

    panel.className =
        "control-panel";


    const title =
        document.createElement("div");

    title.className =
        "control-title";

    title.innerHTML =
        "<span>🗺️ BASEMAP</span>" +
        "<span>▼</span>";


    const content =
        document.createElement("div");

    content.className =
        "control-content";


    title.onclick = function() {

        panel.classList.toggle(
            "collapsed"
        );

    };


    createMapButton(
        content,
        "🛰️ Google Satellite",
        "satellite"
    );


    createMapButton(
        content,
        "🌍 Google Hybrid",
        "hybrid"
    );


    createMapButton(
        content,
        "🗺️ Google Roadmap",
        "roadmap"
    );


    createMapButton(
        content,
        "⛰️ Google Terrain",
        "terrain"
    );


    panel.appendChild(title);

    panel.appendChild(content);


    map.controls[
        google.maps.ControlPosition.TOP_RIGHT
    ].push(panel);

}


/* =====================================================
   BASEMAP BUTTON
===================================================== */

function createMapButton(
    parent,
    text,
    mapType
) {

    const button =
        document.createElement("button");

    button.className =
        "map-button";

    button.innerHTML =
        text;


    button.onclick =
        function() {

            map.setMapTypeId(
                mapType
            );

        };


    parent.appendChild(button);

}


/* =====================================================
   POSITION PANEL
===================================================== */

function createLocationPanel() {

    const panel =
        document.createElement("div");

    panel.className =
        "control-panel";


    const title =
        document.createElement("div");

    title.className =
        "control-title";

    title.innerHTML =
        "<span>📍 POSISI SAYA</span>" +
        "<span>▼</span>";


    const content =
        document.createElement("div");

    content.className =
        "control-content";


    title.onclick = function() {

        panel.classList.toggle(
            "collapsed"
        );

    };


    const button =
        document.createElement("button");

    button.className =
        "location-button";

    button.innerHTML =
        "📍 Tampilkan Posisi Saya";


    button.onclick =
        showMyLocation;


    content.appendChild(button);

    panel.appendChild(title);

    panel.appendChild(content);


    map.controls[
        google.maps.ControlPosition.TOP_RIGHT
    ].push(panel);

}


/* =====================================================
   MY LOCATION
===================================================== */

function showMyLocation() {

    if (!navigator.geolocation) {

        alert(
            "Browser tidak mendukung GPS."
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            const location =
                new google.maps.LatLng(
                    lat,
                    lng
                );


            map.setCenter(location);

            map.setZoom(17);


            if (myLocationMarker) {

                myLocationMarker.setMap(
                    null
                );

            }


            myLocationMarker =
                new google.maps.Marker({

                    position: location,

                    map: map,

                    title:
                        "Posisi Saya",

                    icon: {

                        path:
                            google.maps.SymbolPath.CIRCLE,

                        scale: 8,

                        fillColor:
                            "#1565c0",

                        fillOpacity: 1,

                        strokeColor:
                            "#ffffff",

                        strokeWeight: 3

                    }

                });


            infoWindow.setContent(

                "<b>📍 Posisi Saya</b><br>" +

                "Latitude: " +
                lat.toFixed(8) +

                "<br>" +

                "Longitude: " +
                lng.toFixed(8)

            );


            infoWindow.open(
                map,
                myLocationMarker
            );

        },


        function(error) {

            alert(
                "Posisi tidak dapat diperoleh. " +
                "Pastikan izin lokasi/GPS pada browser sudah diaktifkan."
            );

        },

        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );

}

</script>

</body>
</html>
