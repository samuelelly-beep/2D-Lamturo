<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lamturo GIS</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
}

/* =========================
   LOGO
========================= */

#logoBox {
    position: absolute;
    z-index: 1000;
    top: 15px;
    left: 15px;
    background: white;
    padding: 8px 12px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.25);

    display: flex;
    align-items: center;
}

#logoBox img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    margin-right: 8px;
}

.logoTitle {
    font-size: 20px;
    font-weight: bold;
    color: #123b68;
}

.logoSub {
    font-size: 11px;
    color: #4b9652;
    margin-top: 3px;
}

/* =========================
   PANEL
========================= */

#panel {
    position: absolute;
    z-index: 1000;
    right: 15px;
    top: 15px;
    width: 180px;
}

.box {
    background: white;
    border-radius: 10px;
    margin-bottom: 8px;
    box-shadow: 0 3px 12px rgba(0,0,0,.25);
    overflow: hidden;
}

.boxTitle {
    width: 100%;
    border: 0;
    background: white;
    padding: 11px;
    text-align: left;
    font-size: 14px;
    font-weight: bold;
    color: #163c63;
    cursor: pointer;
}

.boxContent {
    display: none;
    border-top: 1px solid #ddd;
    padding: 8px;
}

.box.open .boxContent {
    display: block;
}

.layerRow {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 2px;
    font-size: 12px;
}

.lineSymbol {
    width: 25px;
    height: 3px;
    display: inline-block;
}

.sourceSymbol {
    background: red;
}

.receiverSymbol {
    background: #003f9e;
}

.pointSymbol {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
}

.spSymbol {
    background: red;
}

.trasSymbol {
    background: blue;
}

.baseButton {
    width: 100%;
    padding: 7px;
    margin-bottom: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: white;
    text-align: left;
    cursor: pointer;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #logoBox {
        top: 8px;
        left: 8px;
        padding: 5px 8px;
    }

    #logoBox img {
        width: 38px;
        height: 38px;
    }

    .logoTitle {
        font-size: 15px;
    }

    .logoSub {
        font-size: 8px;
    }

    #panel {
        right: 8px;
        top: 8px;
        width: 145px;
    }

    .boxTitle {
        padding: 9px;
        font-size: 12px;
    }

    .layerRow {
        font-size: 11px;
    }
}

/* =========================
   ATTRIBUTE TABLE
========================= */

.attributeTable {
    border-collapse: collapse;
    font-size: 12px;
    width: 100%;
}

.attributeTable td {
    border-bottom: 1px solid #ddd;
    padding: 5px;
    vertical-align: top;
}

.attributeTable td:first-child {
    font-weight: bold;
    color: #555;
    width: 40%;
}

.gm-style .gm-style-iw-c {
    max-width: 360px !important;
}

.popupScroll {
    max-height: 350px;
    overflow-y: auto;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- =========================
     LOGO
========================= -->

<div id="logoBox">
    <img src="logo.png">
    <div>
        <div class="logoTitle">LAMTURO GIS</div>
        <div class="logoSub">WEB GIS SEISMIK 2D</div>
    </div>
</div>

<!-- =========================
     PANEL
========================= -->

<div id="panel">

    <!-- LAYERS -->

    <div class="box open">

        <button class="boxTitle"
                onclick="toggleBox(this)">
            📚 LAYERS ▼
        </button>

        <div class="boxContent">

            <label class="layerRow">
                <input type="checkbox"
                       id="sourceCheck"
                       checked
                       onchange="toggleSource()">

                <span class="lineSymbol sourceSymbol"></span>

                Source Line
            </label>

            <label class="layerRow">
                <input type="checkbox"
                       id="receiverCheck"
                       checked
                       onchange="toggleReceiver()">

                <span class="lineSymbol receiverSymbol"></span>

                Receiver Line
            </label>

            <label class="layerRow">
                <input type="checkbox"
                       id="spCheck"
                       onchange="updatePoints()">

                <span class="pointSymbol spSymbol"></span>

                East SP
            </label>

            <label class="layerRow">
                <input type="checkbox"
                       id="trasCheck"
                       onchange="updatePoints()">

                <span class="pointSymbol trasSymbol"></span>

                East TRAS
            </label>

        </div>
    </div>


    <!-- BASEMAP -->

    <div class="box">

        <button class="boxTitle"
                onclick="toggleBox(this)">
            🗺️ BASEMAP ▼
        </button>

        <div class="boxContent">

            <button class="baseButton"
                    onclick="setMapType('satellite')">
                🛰️ Google Satellite
            </button>

            <button class="baseButton"
                    onclick="setMapType('hybrid')">
                🌍 Google Hybrid
            </button>

            <button class="baseButton"
                    onclick="setMapType('roadmap')">
                🗺️ Google Roadmap
            </button>

            <button class="baseButton"
                    onclick="setMapType('terrain')">
                ⛰️ Google Terrain
            </button>

        </div>
    </div>


    <!-- POSISI -->

    <div class="box">

        <button class="boxTitle"
                onclick="locateMe()">
            📍 POSISI SAYA
        </button>

    </div>

</div>


<script>

/* =========================================================
   GOOGLE MAP
========================================================= */

let map;

let sourceLayer = null;
let receiverLayer = null;

let spObjects = [];
let trasObjects = [];

let spDataCache = {};
let trasDataCache = {};


/*
   PEMBAGIAN DATA

   sp_1.geojson
   sp_2.geojson

   tras_1.geojson
   tras_2.geojson
*/

const SP_MID = 112.33;
const TRAS_MID = 112.33;


/* =========================================================
   INITIALIZE MAP
========================================================= */

async function initMap() {

    const { Map } =
        await google.maps.importLibrary("maps");

    map = new Map(document.getElementById("map"), {

        center: {
            lat: -7.20,
            lng: 112.40
        },

        zoom: 10,

        mapTypeId: "satellite",

        streetViewControl: false,

        fullscreenControl: true,

        mapTypeControl: false,

        zoomControl: true,

        gestureHandling: "greedy"
    });


    /*
       LOAD SOURCE LINE
    */

    fetch("east_source_line.geojson")
        .then(response => response.json())
        .then(data => {

            sourceLayer =
                new google.maps.Data();

            sourceLayer.setStyle({

                strokeColor: "#ff0000",

                strokeWeight: 2.5,

                zIndex: 20
            });

            sourceLayer.addGeoJson(data);

            sourceLayer.setMap(map);

        });


    /*
       LOAD RECEIVER LINE
    */

    fetch("east_receiver_line.geojson")
        .then(response => response.json())
        .then(data => {

            receiverLayer =
                new google.maps.Data();

            receiverLayer.setStyle({

                strokeColor: "#003f9e",

                strokeWeight: 1.5,

                zIndex: 10
            });

            receiverLayer.addGeoJson(data);

            receiverLayer.setMap(map);

        });


    /*
       UPDATE TITIK SAAT ZOOM / PAN
    */

    map.addListener("idle", function() {

        updatePoints();

    });

}


/* =========================================================
   BASEMAP
========================================================= */

function setMapType(type) {

    map.setMapTypeId(type);

}


/* =========================================================
   PANEL
========================================================= */

function toggleBox(button) {

    const box =
        button.parentElement;

    box.classList.toggle("open");

}


/* =========================================================
   SOURCE LINE
========================================================= */

function toggleSource() {

    if (!sourceLayer)
        return;

    const checked =
        document.getElementById("sourceCheck").checked;

    sourceLayer.setMap(
        checked ? map : null
    );

}


/* =========================================================
   RECEIVER LINE
========================================================= */

function toggleReceiver() {

    if (!receiverLayer)
        return;

    const checked =
        document.getElementById("receiverCheck").checked;

    receiverLayer.setMap(
        checked ? map : null
    );

}


/* =========================================================
   UPDATE POINTS
========================================================= */

async function updatePoints() {

    if (!map)
        return;


    const spOn =
        document.getElementById("spCheck").checked;

    const trasOn =
        document.getElementById("trasCheck").checked;


    /*
       HANYA TAMPILKAN TITIK
       KALAU ZOOM SUDAH CUKUP DEKAT
    */

    if (map.getZoom() < 13) {

        clearPoints();

        return;
    }


    if (!spOn && !trasOn) {

        clearPoints();

        return;
    }


    clearPoints();


    const bounds =
        map.getBounds();

    if (!bounds)
        return;


    /*
       TENTUKAN FILE BERDASARKAN EXTENT
    */

    const west =
        bounds.getSouthWest().lng();

    const east =
        bounds.getNorthEast().lng();


    /* ======================
       SP
    ====================== */

    if (spOn) {

        if (west <= SP_MID) {

            await loadPointFile(
                "sp_1.geojson",
                "sp",
                bounds
            );

        }

        if (east > SP_MID) {

            await loadPointFile(
                "sp_2.geojson",
                "sp",
                bounds
            );

        }

    }


    /* ======================
       TRAS
    ====================== */

    if (trasOn) {

        if (west <= TRAS_MID) {

            await loadPointFile(
                "tras_1.geojson",
                "tras",
                bounds
            );

        }

        if (east > TRAS_MID) {

            await loadPointFile(
                "tras_2.geojson",
                "tras",
                bounds
            );

        }

    }

}


/* =========================================================
   LOAD POINT FILE
========================================================= */

async function loadPointFile(
    filename,
    type,
    bounds
) {

    let cache;

    if (type === "sp") {

        cache = spDataCache;

    } else {

        cache = trasDataCache;

    }


    /*
       DOWNLOAD HANYA SEKALI
    */

    if (!cache[filename]) {

        try {

            const response =
                await fetch(filename);

            if (!response.ok)
                return;

            const data =
                await response.json();

            cache[filename] =
                data.features;

        }

        catch(error) {

            console.error(
                "Gagal membaca:",
                filename,
                error
            );

            return;
        }

    }


    /*
       TAMPILKAN HANYA TITIK
       YANG MASUK EXTENT PETA
    */

    const features =
        cache[filename];


    for (const feature of features) {

        if (!feature.geometry)
            continue;

        if (feature.geometry.type !== "Point")
            continue;


        const coordinates =
            feature.geometry.coordinates;


        const lng =
            Number(coordinates[0]);

        const lat =
            Number(coordinates[1]);


        /*
           FILTER EXTENT
        */

        if (!bounds.contains(
            new google.maps.LatLng(
                lat,
                lng
            )
        )) {

            continue;

        }


        createPoint(
            lat,
            lng,
            feature.properties || {},
            type
        );

    }

}


/* =========================================================
   CREATE POINT
========================================================= */

function createPoint(
    lat,
    lng,
    attributes,
    type
) {

    const color =
        type === "sp"
            ? "#ff0000"
            : "#0066ff";


    const circle =
        new google.maps.Circle({

            map: map,

            center: {
                lat: lat,
                lng: lng
            },

            radius: type === "sp"
                ? 3.5
                : 3,

            fillColor: color,

            fillOpacity: 1,

            strokeColor: color,

            strokeWeight: 0.8,

            clickable: true,

            zIndex:
                type === "sp"
                    ? 100
                    : 90
        });


    /*
       CLICK POINT
    */

    circle.addListener(
        "click",
        function(event) {

            showAttributes(
                event.latLng,
                attributes,
                type
            );

        }
    );


    if (type === "sp") {

        spObjects.push(circle);

    } else {

        trasObjects.push(circle);

    }

}


/* =========================================================
   ATTRIBUTE POPUP
========================================================= */

let infoWindow = null;


function showAttributes(
    position,
    attributes,
    type
) {

    if (!infoWindow) {

        infoWindow =
            new google.maps.InfoWindow();

    }


    let html = "";

    html +=
        '<div class="popupScroll">';


    html +=
        '<div style="font-size:16px;font-weight:bold;margin-bottom:8px;color:' +
        (
            type === "sp"
                ? "red"
                : "blue"
        ) +
        '">' +
        (
            type === "sp"
                ? "🔴 SP"
                : "🔵 TRAS"
        ) +
        '</div>';


    html +=
        '<table class="attributeTable">';


    /*
       SEMUA ATRIBUT ASLI
    */

    for (
        const key in attributes
    ) {

        let value =
            attributes[key];


        if (
            value === null ||
            value === undefined
        ) {

            value = "";

        }


        html +=
            "<tr>" +

            "<td>" +
            escapeHTML(key) +
            "</td>" +

            "<td>" +
            escapeHTML(
                String(value)
            ) +
            "</td>" +

            "</tr>";

    }


    /*
       KOORDINAT
    */

    html +=
        "<tr>" +

        "<td>Latitude</td>" +

        "<td>" +
        Number(
            position.lat()
        ).toFixed(7) +
        "</td>" +

        "</tr>";


    html +=
        "<tr>" +

        "<td>Longitude</td>" +

        "<td>" +
        Number(
            position.lng()
        ).toFixed(7) +
        "</td>" +

        "</tr>";


    html +=
        "</table></div>";


    infoWindow.setContent(
        html
    );


    infoWindow.setPosition(
        position
    );


    infoWindow.open({
        map: map
    });

}


/* =========================================================
   CLEAR POINTS
========================================================= */

function clearPoints() {

    for (
        const object
        of spObjects
    ) {

        object.setMap(null);

    }


    for (
        const object
        of trasObjects
    ) {

        object.setMap(null);

    }


    spObjects = [];

    trasObjects = [];

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return value
        .replace(
            /[&<>"']/g,
            function(char) {

                return {

                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"

                }[char];

            }
        );

}


/* =========================================================
   POSISI SAYA
========================================================= */

function locateMe() {

    if (!navigator.geolocation) {

        alert(
            "Browser tidak mendukung GPS."
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            map.setCenter({
                lat: lat,
                lng: lng
            });


            map.setZoom(17);


            new google.maps.Marker({

                position: {
                    lat: lat,
                    lng: lng
                },

                map: map,

                title: "Posisi Saya"

            });

        },

        function() {

            alert(
                "Lokasi tidak dapat diperoleh. Pastikan izin lokasi browser diaktifkan."
            );

        },

        {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0
        }

    );

}

</script>


<!-- =====================================================
     GOOGLE MAPS API

     GANTI:
     YOUR_GOOGLE_MAPS_API_KEY

     DENGAN API KEY ANDA SENDIRI
===================================================== -->

<script
    async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtUgo1bsWsw0XXlDNvReYeCwohPiDc79&loading=async&callback=initMap">
</script>

</body>
</html>
