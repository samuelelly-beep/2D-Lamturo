<!doctype html>
<html lang="id">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Lamturo GIS</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<style>

/* =====================================================
   DASAR
===================================================== */

html,
body,
#map{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:Arial,sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

#head{

    position:absolute;

    z-index:1000;

    left:60px;
    top:8px;

    background:#fff;

    padding:5px 9px;

    border-radius:9px;

    box-shadow:0 2px 8px #0004;

    display:flex;

    align-items:center;
}


#head img{

    width:42px;
    height:42px;

    object-fit:contain;

    margin-right:7px;
}


#t{

    font-weight:bold;

    color:#12345a;

    font-size:16px;
}


#s{

    font-size:9px;

    color:#4a8f45;
}


/* =====================================================
   PANEL
===================================================== */

#ctl{

    position:absolute;

    z-index:1000;

    right:8px;
    top:8px;

    width:155px;

    display:flex;

    flex-direction:column;

    gap:5px;
}


.p{

    background:#fff;

    border-radius:8px;

    box-shadow:0 2px 8px #0004;

    overflow:hidden;
}


.h{

    border:0;

    background:#fff;

    width:100%;

    padding:9px;

    text-align:left;

    font-weight:bold;

    color:#12345a;

    cursor:pointer;
}


.c{

    display:none;

    padding:6px;

    border-top:1px solid #ddd;
}


.p.open .c{

    display:block;
}


/* =====================================================
   LAYER ROW
===================================================== */

.r{

    display:flex;

    align-items:center;

    gap:6px;

    padding:5px 1px;

    font-size:11px;
}


.ln{

    display:inline-block;

    width:22px;
    height:3px;
}


.src{

    background:red;
}


.rec{

    background:#003f9e;
}


.pt{

    width:10px;
    height:10px;

    border-radius:50%;

    display:inline-block;
}


.sp{

    background:red;
}


.tr{

    background:#06f;
}


/* =====================================================
   BASEMAP
===================================================== */

.b{

    width:100%;

    padding:6px;

    margin-bottom:4px;

    background:white;

    border:1px solid #ccc;

    border-radius:5px;

    text-align:left;

    font-size:11px;

    cursor:pointer;
}


/* =====================================================
   POPUP
===================================================== */

.at{

    border-collapse:collapse;

    font-size:12px;

    width:100%;
}


.at td{

    padding:4px;

    border-bottom:1px solid #ddd;

    vertical-align:top;
}


.at td:first-child{

    font-weight:bold;

    color:#555;

    width:40%;
}


.leaflet-popup-content{

    max-height:330px;

    overflow:auto;
}


/* =====================================================
   LABEL SP
===================================================== */

.sp-label{

    background:rgba(255,255,255,.82);

    border:0.5px solid red;

    color:red;

    font-weight:bold;

    font-size:7px;

    line-height:8px;

    padding:0 2px;

    border-radius:2px;

    box-shadow:0 1px 2px #0003;

    white-space:nowrap;

}


/* =====================================================
   LABEL TRAS
===================================================== */

.tras-label{

    background:rgba(255,255,255,.78);

    border:0.5px solid #06f;

    color:#0055cc;

    font-weight:normal;

    font-size:6px;

    line-height:7px;

    padding:0 1.5px;

    border-radius:2px;

    box-shadow:0 1px 2px #0002;

    white-space:nowrap;

}


/* =====================================================
   LABEL VERTICAL
===================================================== */

.sp-vertical{

    transform:rotate(90deg);

    transform-origin:center center;
}


.tras-vertical{

    transform:rotate(90deg);

    transform-origin:center center;
}


.leaflet-tooltip:before{

    display:none;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    #ctl{

        width:145px;

    }


    #head{

        left:55px;

    }


    #t{

        font-size:14px;

    }


    #head img{

        width:37px;

        height:37px;

    }


    .sp-label{

        font-size:7px;

    }


    .tras-label{

        font-size:5.5px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div id="head">

    <img src="logo.png">

    <div>

        <div id="t">
            LAMTURO GIS
        </div>

        <div id="s">
            WEB GIS SEISMIK 2D
        </div>

    </div>

</div>


<!-- MAP -->

<div id="map"></div>


<!-- =====================================================
     CONTROL
===================================================== -->

<div id="ctl">


    <!-- LAYERS -->

    <div class="p">

        <button class="h"
                onclick="op(this)">

            📚 LAYERS ▼

        </button>


        <div class="c">


            <!-- SOURCE -->

            <label class="r">

                <input id="srcOn"
                       type="checkbox"
                       checked
                       onchange="line('src')">

                <span class="ln src"></span>

                Source Line

            </label>


            <!-- RECEIVER -->

            <label class="r">

                <input id="recOn"
                       type="checkbox"
                       checked
                       onchange="line('rec')">

                <span class="ln rec"></span>

                Receiver Line

            </label>


            <!-- SP -->

            <label class="r">

                <input id="spOn"
                       type="checkbox"
                       onchange="points()">

                <span class="pt sp"></span>

                East SP

            </label>


            <!-- TRAS -->

            <label class="r">

                <input id="trOn"
                       type="checkbox"
                       onchange="points()">

                <span class="pt tr"></span>

                East TRAS

            </label>


        </div>

    </div>



    <!-- BASEMAP -->

    <div class="p">

        <button class="h"
                onclick="op(this)">

            🗺️ BASEMAP ▼

        </button>


        <div class="c">

            <button class="b"
                    onclick="base('sat')">

                🛰️ Satellite

            </button>


            <button class="b"
                    onclick="base('hyb')">

                🌍 Hybrid

            </button>


            <button class="b"
                    onclick="base('road')">

                🗺️ Roadmap

            </button>

        </div>

    </div>



    <!-- POSITION -->

    <div class="p">

        <button class="h"
                onclick="locate()">

            📍 POSISI SAYA

        </button>

    </div>


</div>


<script>

/* =====================================================
   KONFIGURASI TILE
===================================================== */


/*
   Dari tiles_manifest.json

   Grid = 0.02 derajat
*/

const GRID_SIZE = 0.02;


/*
   SP/TRAS baru dibaca
   ketika zoom 20 atau lebih
*/

const POINT_MIN_ZOOM = 20;


/*
   Label muncul pada zoom 20+
*/

const LABEL_MIN_ZOOM = 20;



/* =====================================================
   VARIABEL
===================================================== */

let map;

let src;

let rec;

let spL;

let trL;

let sat;

let road;

let hyb;


/*
   Cache tile

   Supaya tile yang sudah pernah
   dibaca tidak download lagi.
*/

const tileCache = new Map();



/* =====================================================
   INIT
===================================================== */

function init(){


    map =

        L.map('map')
        .setView(
            [-7.2,112.4],
            10
        );



    /* =================================================
       PANES
    ================================================= */


    /*
       Receiver
    */

    map.createPane('rec');

    map.getPane('rec')
       .style.zIndex = 400;



    /*
       Source

       lebih tinggi dari receiver
    */

    map.createPane('src');

    map.getPane('src')
       .style.zIndex = 450;



    /*
       TRAS
    */

    map.createPane('tr');

    map.getPane('tr')
       .style.zIndex = 500;



    /*
       SP

       SP lebih tinggi daripada TRAS
    */

    map.createPane('sp');

    map.getPane('sp')
       .style.zIndex = 550;



    /* =================================================
       ESRI SATELLITE
    ================================================= */

    sat =

        L.tileLayer(

            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

            {

                attribution:'Tiles © Esri'

            }

        )

        .addTo(map);



    /* =================================================
       OSM
    ================================================= */

    road =

        L.tileLayer(

            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

            {

                attribution:'© OpenStreetMap'

            }

        );



    /* =================================================
       HYBRID
    ================================================= */

    const labels =

        L.tileLayer(

            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

            {

                opacity:.25,

                attribution:'© OpenStreetMap'

            }

        );


    hyb =

        L.layerGroup([

            sat,

            labels

        ]);



    /* =================================================
       SOURCE LINE
    ================================================= */

    src =

        L.geoJSON(

            null,

            {

                pane:'src',

                style:{

                    color:'red',

                    weight:2

                }

            }

        )

        .addTo(map);



    /* =================================================
       RECEIVER LINE
    ================================================= */

    rec =

        L.geoJSON(

            null,

            {

                pane:'rec',

                style:{

                    color:'#003f9e',

                    weight:1.5

                }

            }

        )

        .addTo(map);



    /* =================================================
       POINT LAYERS
    ================================================= */

    spL =

        L.layerGroup();


    trL =

        L.layerGroup();



    /* =================================================
       SOURCE
    ================================================= */

    fetch(

        'east_source_line.geojson'

    )

    .then(

        r => r.json()

    )

    .then(

        d => src.addData(d)

    )

    .catch(

        e => console.warn(
            'Source line:',
            e
        )

    );



    /* =================================================
       RECEIVER
    ================================================= */

    fetch(

        'east_receiver_line.geojson'

    )

    .then(

        r => r.json()

    )

    .then(

        d => rec.addData(d)

    )

    .catch(

        e => console.warn(
            'Receiver line:',
            e
        )

    );



    /* =================================================
       MAP EVENT
    ================================================= */

    map.on(
        'moveend',
        updatePoints
    );


    map.on(
        'zoomend',
        updatePoints
    );

}


/* =====================================================
   TILE INDEX
===================================================== */

function tileIndex(value){

    return Math.floor(
        value / GRID_SIZE
    );

}


/* =====================================================
   TILE YANG TERLIHAT
===================================================== */

function visibleTiles(){


    const bounds =
        map.getBounds();


    const minX =
        tileIndex(
            bounds.getWest()
        );


    const maxX =
        tileIndex(
            bounds.getEast()
        );


    const minY =
        tileIndex(
            bounds.getSouth()
        );


    const maxY =
        tileIndex(
            bounds.getNorth()
        );


    const tiles = [];


    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let y=minY;
            y<=maxY;
            y++
        ){

            tiles.push([
                x,
                y
            ]);

        }

    }


    return tiles;

}


/* =====================================================
   LOAD TILE
===================================================== */

async function loadTile(
    source,
    x,
    y
){


    /*
       Struktur ZIP:

       tiles/<source>/<x>/<y>/data.geojson
    */

    const key =

        source +
        '/' +
        x +
        '/' +
        y;



    /*
       Cache
    */

    if(
        tileCache.has(key)
    ){

        return tileCache.get(key);

    }



    const url =

        'tiles/' +

        source +

        '/' +

        x +

        '/' +

        y +

        '/data.geojson';



    try{


        const response =

            await fetch(url);



        if(
            !response.ok
        ){

            tileCache.set(
                key,
                []
            );

            return [];

        }



        const data =

            await response.json();



        const features =

            data.features || [];



        tileCache.set(
            key,
            features
        );


        return features;


    }

    catch(error){


        console.warn(
            'Tile gagal:',
            url
        );


        tileCache.set(
            key,
            []
        );


        return [];

    }

}


/* =====================================================
   UPDATE POINT
===================================================== */

async function points(){

    updatePoints();

}


async function updatePoints(){


    /*
       Bersihkan tampilan lama
    */

    spL.clearLayers();

    trL.clearLayers();



    /*
       Zoom kurang dari 20

       Jangan baca tile.
    */

    if(
        map.getZoom()
        <
        POINT_MIN_ZOOM
    ){

        if(
            map.hasLayer(spL)
        )
            map.removeLayer(spL);


        if(
            map.hasLayer(trL)
        )
            map.removeLayer(trL);


        return;

    }



    const tiles =
        visibleTiles();



    /* =================================================
       LOAD SP
    ================================================= */

    if(
        document
        .getElementById('spOn')
        .checked
    ){


        const jobs = [];


        for(
            const [x,y]
            of tiles
        ){

            jobs.push(

                loadTile(
                    'sp_1',
                    x,
                    y
                )

            );


            jobs.push(

                loadTile(
                    'sp_2',
                    x,
                    y
                )

            );

        }


        const results =
            await Promise.all(jobs);


        results
            .flat()
            .forEach(

                feature =>

                    addPoint(
                        spL,
                        feature,
                        'sp'
                    )

            );


        spL.addTo(map);


    }

    else{

        if(
            map.hasLayer(spL)
        )
            map.removeLayer(spL);

    }



    /* =================================================
       LOAD TRAS
    ================================================= */

    if(
        document
        .getElementById('trOn')
        .checked
    ){


        const jobs = [];


        for(
            const [x,y]
            of tiles
        ){

            jobs.push(

                loadTile(
                    'tras_1',
                    x,
                    y
                )

            );


            jobs.push(

                loadTile(
                    'tras_2',
                    x,
                    y
                )

            );

        }


        const results =
            await Promise.all(jobs);


        results
            .flat()
            .forEach(

                feature =>

                    addPoint(
                        trL,
                        feature,
                        'tr'
                    )

            );


        trL.addTo(map);


    }

    else{

        if(
            map.hasLayer(trL)
        )
            map.removeLayer(trL);

    }

}


/* =====================================================
   CEK LINTASAN GANJIL
===================================================== */

function isOddLine(lineValue){


    if(
        lineValue === null ||
        lineValue === undefined
    )
        return false;


    const match =

        String(lineValue)
        .match(/\d+/);


    if(!match)
        return false;


    const number =

        parseInt(
            match[0],
            10
        );


    return (
        number % 2 !== 0
    );

}


/* =====================================================
   TAMBAH POINT
===================================================== */

function addPoint(
    layer,
    feature,
    type
){


    if(
        !feature.geometry ||
        feature.geometry.type !== 'Point'
    ){

        return;

    }


    const coordinates =
        feature.geometry.coordinates;


    const lng =
        Number(
            coordinates[0]
        );


    const lat =
        Number(
            coordinates[1]
        );



    /*
       Hanya titik di layar
    */

    if(
        !map
        .getBounds()
        .contains(
            [lat,lng]
        )
    ){

        return;

    }



    const p =
        feature.properties || {};



    /* =================================================
       FIELD SESUAI DATA ASLI
    ================================================= */


    /*
       SP:

       Line
       Sp
       X
       Y
       NAMOBJ
       WADMKC
       WADMKK
    */


    /*
       TRAS:

       Line
       Tr
       X
       Y
       Rotation
       NAMOBJ
       WADMKC
       WADMKK
    */


    const lineValue =
        p.Line ?? '';


    const spValue =
        p.Sp ?? '';


    const trValue =
        p.Tr ?? '';



    /* =================================================
       LABEL
    ================================================= */

    let label = '';



    if(
        type === 'sp'
    ){

        label =

            String(lineValue) +

            (
                spValue !== ''
                    ?
                    '<br>SP ' +
                    String(spValue)
                    :
                    ''
            );

    }



    if(
        type === 'tr'
    ){

        /*
           TRAS dibuat lebih pendek
        */

        label =

            String(lineValue) +

            (
                trValue !== ''
                    ?
                    '<br>' +
                    String(trValue)
                    :
                    ''
            );

    }



    /* =================================================
       MARKER
    ================================================= */

    const marker =

        L.circleMarker(

            [lat,lng],

            {

                pane:
                    type === 'sp'
                        ?
                        'sp'
                        :
                        'tr',

                radius:
                    type === 'sp'
                        ?
                        3
                        :
                        2.3,

                color:
                    type === 'sp'
                        ?
                        'red'
                        :
                        '#06f',

                fillColor:
                    type === 'sp'
                        ?
                        'red'
                        :
                        '#06f',

                fillOpacity:1,

                weight:.5

            }

        );



    /* =================================================
       POPUP SEMUA ATRIBUT
    ================================================= */

    let html =

        '<b>' +

        (
            type === 'sp'
                ?
                '🔴 SP'
                :
                '🔵 TRAS'
        ) +

        '</b>' +

        '<table class="at">';



    Object.keys(p)
        .forEach(

            key => {

                const value =
                    p[key] ?? '';


                html +=

                    '<tr>' +

                    '<td>' +

                    esc(key) +

                    '</td>' +

                    '<td>' +

                    esc(
                        String(value)
                    ) +

                    '</td>' +

                    '</tr>';

            }

        );



    /*
       Koordinat
    */

    html +=

        '<tr>' +

        '<td>Latitude</td>' +

        '<td>' +

        lat.toFixed(7) +

        '</td>' +

        '</tr>';


    html +=

        '<tr>' +

        '<td>Longitude</td>' +

        '<td>' +

        lng.toFixed(7) +

        '</td>' +

        '</tr>';


    html +=

        '</table>';



    /*
       Klik marker
    */

    marker.bindPopup(

        html,

        {
            maxWidth:340
        }

    );



    /* =================================================
       LABEL
    ================================================= */

    if(
        map.getZoom()
        >=
        LABEL_MIN_ZOOM
    ){


        const odd =
            isOddLine(
                lineValue
            );


        let className;


        if(
            type === 'sp'
        ){

            className =

                odd
                    ?
                    'sp-label sp-vertical'
                    :
                    'sp-label';

        }

        else{

            className =

                odd
                    ?
                    'tras-label tras-vertical'
                    :
                    'tras-label';

        }


        marker.bindTooltip(

            label,

            {

                permanent:true,

                direction:'right',

                offset:[
                    3,
                    0
                ],

                opacity:.92,

                className:
                    className

            }

        );

    }


    marker.addTo(layer);

}


/* =====================================================
   TOGGLE LINE
===================================================== */

function line(k){


    const layer =

        k === 'src'
            ?
            src
            :
            rec;


    const checkbox =

        document.getElementById(

            k === 'src'
                ?
                'srcOn'
                :
                'recOn'

        );


    if(
        checkbox.checked
    ){

        layer.addTo(map);

    }

    else{

        map.removeLayer(layer);

    }

}


/* =====================================================
   BASEMAP
===================================================== */

function base(k){


    map.removeLayer(sat);

    map.removeLayer(hyb);

    map.removeLayer(road);



    if(
        k === 'sat'
    ){

        sat.addTo(map);

    }


    if(
        k === 'hyb'
    ){

        hyb.addTo(map);

    }


    if(
        k === 'road'
    ){

        road.addTo(map);

    }

}


/* =====================================================
   MENU
===================================================== */

function op(button){

    button
        .parentElement
        .classList
        .toggle('open');

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

    return String(value)

        .replace(

            /[&<>"']/g,

            function(m){

                return {

                    '&':'&amp;',

                    '<':'&lt;',

                    '>':'&gt;',

                    '"':'&quot;',

                    "'":'&#039;'

                }[m];

            }

        );

}


/* =====================================================
   POSISI SAYA
===================================================== */

let myLocationMarker = null;

let myAccuracyCircle = null;


function locate(){


    if(
        !navigator.geolocation
    ){

        alert(
            'Browser tidak mendukung GPS/lokasi.'
        );

        return;

    }



    navigator.geolocation.getCurrentPosition(

        function(position){


            const lat =
                position.coords.latitude;


            const lng =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;


            const pos =
                [lat,lng];



            if(
                myLocationMarker
            ){

                map.removeLayer(
                    myLocationMarker
                );

            }


            if(
                myAccuracyCircle
            ){

                map.removeLayer(
                    myAccuracyCircle
                );

            }



            myAccuracyCircle =

                L.circle(

                    pos,

                    {

                        radius:accuracy,

                        color:'#0066ff',

                        weight:1,

                        fillColor:'#0066ff',

                        fillOpacity:.12

                    }

                )

                .addTo(map);



            myLocationMarker =

                L.circleMarker(

                    pos,

                    {

                        radius:8,

                        color:'#fff',

                        weight:3,

                        fillColor:'#0066ff',

                        fillOpacity:1

                    }

                )

                .addTo(map);



            myLocationMarker
                .bindPopup(

                    '<b>📍 POSISI SAYA</b>' +

                    '<br><br>' +

                    'Latitude: ' +

                    lat.toFixed(7) +

                    '<br>' +

                    'Longitude: ' +

                    lng.toFixed(7) +

                    '<br>' +

                    'Akurasi: ±' +

                    accuracy.toFixed(1) +

                    ' m'

                )

                .openPopup();



            /*
               Zoom 20
            */

            map.setView(
                pos,
                20
            );



            setTimeout(
                updatePoints,
                300
            );

        },


        function(error){


            let message =
                'Posisi tidak dapat diperoleh.';


            if(
                error.code === 1
            ){

                message =
                    'Izin lokasi ditolak. Silakan izinkan lokasi pada browser.';

            }


            if(
                error.code === 2
            ){

                message =
                    'Posisi GPS tidak tersedia.';

            }


            if(
                error.code === 3
            ){

                message =
                    'Pengambilan posisi GPS timeout.';

            }


            alert(message);

        },


        {

            enableHighAccuracy:true,

            timeout:15000,

            maximumAge:0

        }

    );

}


/* =====================================================
   START
===================================================== */

init();

</script>

</body>

</html>
