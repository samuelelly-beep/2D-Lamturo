<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Lamturo GIS</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html,body,#map{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#head{
  position:absolute;
  z-index:2000;
  left:10px;
  top:10px;
  background:#fff;
  padding:6px 10px;
  border-radius:10px;
  box-shadow:0 2px 9px #0004;
  display:flex;
  align-items:center;
}

#head img{
  width:43px;
  height:43px;
  object-fit:contain;
  margin-right:7px;
}

#t{
  font-weight:bold;
  color:#12345a;
  font-size:16px;
}

#s{
  font-size:9px;
  color:#4a8f45;
  margin-top:2px;
}

#ctl{
  position:absolute;
  z-index:2000;
  right:10px;
  top:10px;
  width:170px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.p{
  background:#fff;
  border-radius:9px;
  box-shadow:0 2px 9px #0004;
  overflow:hidden;
}

.h{
  border:0;
  background:#fff;
  width:100%;
  padding:10px;
  text-align:left;
  font-weight:bold;
  color:#12345a;
  cursor:pointer;
}

.c{
  display:none;
  padding:7px;
  border-top:1px solid #ddd;
}

.p.open .c{
  display:block;
}

.r{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 1px;
  font-size:11px;
}

.ln{
  display:inline-block;
  width:23px;
  height:3px;
}

.src{
  background:red;
}

.rec{
  background:#003f9e;
}

.pt{
  width:11px;
  height:11px;
  border-radius:50%;
  display:inline-block;
}

.sp{
  background:red;
}

.tr{
  background:#06f;
}

.b{
  width:100%;
  padding:7px;
  margin-bottom:4px;
  background:#fff;
  border:1px solid #ccc;
  border-radius:5px;
  text-align:left;
  font-size:11px;
  cursor:pointer;
}

#status{
  position:absolute;
  z-index:2000;
  left:10px;
  bottom:10px;
  background:#fff;
  padding:5px 8px;
  border-radius:7px;
  box-shadow:0 2px 7px #0003;
  font-size:10px;
  color:#555;
}

.at{
  border-collapse:collapse;
  font-size:12px;
}

.at td{
  padding:4px;
  border-bottom:1px solid #ddd;
  vertical-align:top;
}

.at td:first-child{
  font-weight:bold;
  color:#555;
  white-space:nowrap;
}

.leaflet-popup-content{
  max-height:330px;
  overflow:auto;
}


/* ===============================
   LABEL SP / TRAS
================================ */

.point-label{
  background:#fff;
  border:1px solid currentColor;
  border-radius:3px;
  padding:1px 3px;
  font-size:9px;
  line-height:11px;
  font-weight:bold;
  white-space:nowrap;
  box-shadow:0 1px 3px #0002;
  pointer-events:none;
  display:inline-block;
}

.point-label.spLabel{
  color:red;
}

.point-label.trLabel{
  color:#06f;
}

.point-label.odd{
  transform:rotate(90deg);
  transform-origin:top left;
}

.point-label.even{
  transform:none;
}


/* ===============================
   LABEL RECEIVER LINE
================================ */

.receiver-line-label{
  background:rgba(255,255,255,.96);
  border:1px solid #003f9e;
  border-radius:3px;
  color:#003f9e;
  padding:2px 5px;
  font-size:10px;
  line-height:12px;
  font-weight:bold;
  white-space:nowrap;
  box-shadow:0 1px 3px #0003;
  pointer-events:none;
}

@media(max-width:600px){

  #ctl{
    width:145px;
  }

  #t{
    font-size:14px;
  }

  #head img{
    width:37px;
    height:37px;
  }

}

</style>
</head>

<body>

<div id="head">

  <img src="logo.png" alt="Logo">

  <div>

    <div id="t">
      LAMTURO GIS
    </div>

    <div id="s">
      WEB GIS SEISMIK 2D
    </div>

  </div>

</div>


<div id="map"></div>


<div id="ctl">

  <div class="p open">

    <button class="h" onclick="op(this)">
      📚 LAYERS ▼
    </button>

    <div class="c">

      <label class="r">

        <input
          id="srcOn"
          type="checkbox"
          checked
          onchange="toggleLine('src')">

        <span class="ln src"></span>

        Source Line

      </label>


      <label class="r">

        <input
          id="recOn"
          type="checkbox"
          checked
          onchange="toggleLine('rec')">

        <span class="ln rec"></span>

        Receiver Line

      </label>


      <label class="r">

        <input
          id="spOn"
          type="checkbox"
          checked
          onchange="refreshPoints()">

        <span class="pt sp"></span>

        East SP

      </label>


      <label class="r">

        <input
          id="trOn"
          type="checkbox"
          checked
          onchange="refreshPoints()">

        <span class="pt tr"></span>

        East TRAS

      </label>

    </div>

  </div>


  <div class="p">

    <button class="h" onclick="op(this)">
      🗺️ BASEMAP ▼
    </button>

    <div class="c">

      <button class="b" onclick="base('sat')">
        🛰️ Satellite
      </button>

      <button class="b" onclick="base('hyb')">
        🌍 Hybrid
      </button>

      <button class="b" onclick="base('road')">
        🗺️ Roadmap
      </button>

    </div>

  </div>


  <div class="p">

    <button class="h" onclick="locate()">
      📍 POSISI SAYA
    </button>

  </div>

</div>


<div id="status">
  Zoom in untuk menampilkan SP/TRAS.
</div>


<script>

/* =====================================================
   SETTING
===================================================== */

const GRID_DEG = 0.1;

const POINT_MIN_ZOOM = 15;

const LABEL_MIN_ZOOM = 17;

const RECEIVER_LABEL_MAX_ZOOM = 16;

const MAX_ZOOM = 20;


/* =====================================================
   GLOBAL
===================================================== */

let map;

let src;

let rec;

let spL;

let trL;

let spLabels;

let trLabels;

let receiverLabels;

let sat;

let hyb;

let road;

const cache = new Map();


/* =====================================================
   INIT
===================================================== */

function init(){

  map = L.map('map',{

    zoomControl:true,

    maxZoom:MAX_ZOOM,

    preferCanvas:true

  }).setView(

    [-7.2,112.4],

    10

  );


  map.createPane(
    'receiverPane'
  );

  map.createPane(
    'sourcePane'
  );

  map.createPane(
    'pointPane'
  );

  map.createPane(
    'receiverLabelPane'
  );

  map.createPane(
    'labelPane'
  );


  map.getPane(
    'receiverPane'
  ).style.zIndex=410;


  map.getPane(
    'sourcePane'
  ).style.zIndex=430;


  map.getPane(
    'pointPane'
  ).style.zIndex=450;


  map.getPane(
    'receiverLabelPane'
  ).style.zIndex=480;


  map.getPane(
    'labelPane'
  ).style.zIndex=500;


  sat=L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

      maxZoom:MAX_ZOOM,

      maxNativeZoom:19,

      attribution:'Tiles © Esri'

    }

  ).addTo(map);


  road=L.tileLayer(

    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

    {

      maxZoom:MAX_ZOOM,

      attribution:'© OpenStreetMap contributors'

    }

  );


  hyb=L.layerGroup([

    sat,

    L.tileLayer(

      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

      {

        opacity:.25,

        maxZoom:MAX_ZOOM

      }

    )

  ]);


  src=L.geoJSON(null,{

    pane:'sourcePane',

    style:{

      color:'red',

      weight:2.2,

      opacity:.95

    },

    onEachFeature:linePopup

  }).addTo(map);


  rec=L.geoJSON(null,{

    pane:'receiverPane',

    style:{

      color:'#003f9e',

      weight:1.7,

      opacity:.95

    },

    onEachFeature:function(
      feature,
      layer
    ){

      linePopup(
        feature,
        layer
      );

    }

  }).addTo(map);


  spL=L.layerGroup();

  trL=L.layerGroup();


  spLabels=L.layerGroup();

  trLabels=L.layerGroup();


  receiverLabels=L.layerGroup();


  loadLines();


  map.on(

    'moveend zoomend',

    ()=>{

      clearTimeout(
        window._refreshTimer
      );


      window._refreshTimer=

        setTimeout(

          ()=>{

            refreshPoints();

            updateReceiverLabels();

          },

          120

        );

    }

  );


  updateStatus();

}


/* =====================================================
   LOAD LINE
===================================================== */

async function loadLines(){

  try{

    const a=
      await fetch(
        'east_source_line.geojson'
      );


    if(a.ok){

      src.addData(
        await a.json()
      );

    }

  }catch(e){

    console.warn(
      'Source line:',
      e
    );

  }


  try{

    const a=
      await fetch(
        'east_receiver_line.geojson'
      );


    if(a.ok){

      rec.addData(
        await a.json()
      );

      updateReceiverLabels();

    }

  }catch(e){

    console.warn(
      'Receiver line:',
      e
    );

  }

}


/* =====================================================
   LINE POPUP
===================================================== */

function linePopup(
  feature,
  layer
){

  const p=
    feature.properties || {};


  let h=
    '<b>📏 LINE</b><table class="at">';


  Object.keys(p).forEach(
    k=>{

      h+=

        `<tr>
          <td>${esc(k)}</td>
          <td>${esc(String(p[k]??''))}</td>
        </tr>`;

    }
  );


  h+='</table>';


  layer.bindPopup(

    h,

    {
      maxWidth:360
    }

  );

}


/* =====================================================
   RECEIVER LINE NAME
===================================================== */

function getReceiverLineName(
  feature
){

  const p=
    feature.properties || {};


  if(

    p.Line!==undefined &&

    p.Line!==null &&

    String(p.Line).trim()!==''
  ){

    return String(p.Line);

  }


  const keys=[

    'LINE',

    'line',

    'Line_Name',

    'LINE_NAME',

    'line_name',

    'LineName',

    'LINENAME',

    'Name',

    'name',

    'Lintasan',

    'LINTASAN',

    'lintasan'

  ];


  for(
    const k of keys
  ){

    if(

      p[k]!==undefined &&

      p[k]!==null &&

      String(p[k]).trim()!==''
    ){

      return String(p[k]);

    }

  }


  return '';

}


/* =====================================================
   RECEIVER LABEL POSITION
===================================================== */

function receiverLabelPosition(
  layer
){

  try{

    const latlngs=
      layer.getLatLngs();

    const points=[];


    function collect(arr){

      if(!arr)
        return;


      for(
        const item of arr
      ){

        if(

          item &&

          typeof item.lat==='number' &&

          typeof item.lng==='number'

        ){

          points.push(item);

        }

        else if(
          Array.isArray(item)
        ){

          collect(item);

        }

      }

    }


    collect(latlngs);


    if(!points.length){

      return layer
        .getBounds()
        .getCenter();

    }


    const center=
      map.getCenter();


    let best=
      points[0];

    let bestDistance=
      Infinity;


    for(
      const p of points
    ){

      const dx=
        p.lng-center.lng;

      const dy=
        p.lat-center.lat;

      const d=
        dx*dx+
        dy*dy;


      if(
        d<bestDistance
      ){

        bestDistance=d;

        best=p;

      }

    }


    return best;

  }catch(e){

    return layer
      .getBounds()
      .getCenter();

  }

}


/* =====================================================
   ADD RECEIVER LABEL
===================================================== */

function addReceiverLabel(
  feature,
  layer
){

  const name=
    getReceiverLineName(
      feature
    );


  if(!name)
    return;


  const position=
    receiverLabelPosition(
      layer
    );


  const icon=
    L.divIcon({

      className:'',

      html:

        `<div class="receiver-line-label">
          ${esc(name)}
        </div>`,

      iconSize:null,

      iconAnchor:[0,6]

    });


  const marker=

    L.marker(

      position,

      {

        pane:
          'receiverLabelPane',

        icon:icon,

        interactive:false,

        keyboard:false

      }

    );


  receiverLabels.addLayer(
    marker
  );

}


/* =====================================================
   UPDATE RECEIVER LABEL
===================================================== */

function updateReceiverLabels(){

  if(!receiverLabels)
    return;


  receiverLabels.clearLayers();


  const checkbox=
    document.getElementById(
      'recOn'
    );


  if(

    checkbox &&

    !checkbox.checked

  ){

    if(
      map.hasLayer(
        receiverLabels
      )
    ){

      map.removeLayer(
        receiverLabels
      );

    }

    return;

  }


  /*
     LABEL RECEIVER HANYA ZOOM 1-16.

     ZOOM 17,18,19,20:
     LABEL HILANG.

     GARIS RECEIVER TETAP ADA.
  */

  if(
    map.getZoom() >
    RECEIVER_LABEL_MAX_ZOOM
  ){

    if(
      map.hasLayer(
        receiverLabels
      )
    ){

      map.removeLayer(
        receiverLabels
      );

    }

    return;

  }


  if(!rec)
    return;


  rec.eachLayer(

    layer=>{

      if(
        !layer.feature
      )
        return;


      addReceiverLabel(

        layer.feature,

        layer

      );

    }

  );


  if(

    !map.hasLayer(
      receiverLabels
    )

  ){

    receiverLabels.addTo(
      map
    );

  }

}


/* =====================================================
   TILE INDEX
===================================================== */

function tileIndex(v){

  return Math.floor(
    v/GRID_DEG
  )*5;

}


/* =====================================================
   TILE PATH
===================================================== */

function tilePath(
  kind,
  x,
  y
){

  return `tiles/${kind}/${x}/${y}/data.geojson`;

}


/* =====================================================
   VISIBLE TILE
===================================================== */

function visibleTileKeys(){

  const b=
    map.getBounds();


  let x0=
    tileIndex(
      b.getWest()
    )-5;


  let x1=
    tileIndex(
      b.getEast()
    )+5;


  let y0=
    tileIndex(
      b.getSouth()
    )-5;


  let y1=
    tileIndex(
      b.getNorth()
    )+5;


  const out=[];


  for(
    let x=x0;

    x<=x1;

    x+=5

  ){

    for(
      let y=y0;

      y<=y1;

      y+=5

    ){

      out.push([
        x,
        y
      ]);

    }

  }


  return out;

}


/* =====================================================
   GET TILE
===================================================== */

async function getTile(
  kind,
  x,
  y
){

  const key=
    `${kind}/${x}/${y}`;


  if(
    cache.has(key)
  ){

    return cache.get(
      key
    );

  }


  const p=
    tilePath(
      kind,
      x,
      y
    );


  try{

    const r=
      await fetch(
        p,
        {
          cache:
            'force-cache'
        }
      );


    if(!r.ok){

      cache.set(
        key,
        []
      );

      return [];

    }


    const d=
      await r.json();


    const fs=
      d.features || [];


    cache.set(
      key,
      fs
    );


    return fs;

  }catch(e){

    cache.set(
      key,
      []
    );

    return [];

  }

}


/* =====================================================
   CLEAR POINT
===================================================== */

function clearPointLayers(){

  spL.clearLayers();

  trL.clearLayers();

  spLabels.clearLayers();

  trLabels.clearLayers();

}


/* =====================================================
   REFRESH POINTS
===================================================== */

async function refreshPoints(){

  updateStatus();


  clearPointLayers();


  if(
    map.getZoom()<
    POINT_MIN_ZOOM
  ){

    map.removeLayer(
      spL
    );

    map.removeLayer(
      trL
    );

    map.removeLayer(
      spLabels
    );

    map.removeLayer(
      trLabels
    );

    return;

  }


  const keys=
    visibleTileKeys();


  const jobs=[];


  if(
    document.getElementById(
      'spOn'
    ).checked
  ){

    for(
      const [x,y]
      of keys
    ){

      jobs.push(
        loadAndDraw(
          'sp_1',
          x,
          y
        )
      );

    }


    for(
      const [x,y]
      of keys
    ){

      jobs.push(
        loadAndDraw(
          'sp_2',
          x,
          y
        )
      );

    }

  }


  if(
    document.getElementById(
      'trOn'
    ).checked
  ){

    for(
      const [x,y]
      of keys
    ){

      jobs.push(
        loadAndDraw(
          'tras_1',
          x,
          y
        )
      );

    }


    for(
      const [x,y]
      of keys
    ){

      jobs.push(
        loadAndDraw(
          'tras_2',
          x,
          y
        )
      );

    }

  }


  await Promise.all(
    jobs
  );


  if(
    document.getElementById(
      'spOn'
    ).checked
  ){

    spL.addTo(
      map
    );

  }


  if(
    document.getElementById(
      'trOn'
    ).checked
  ){

    trL.addTo(
      map
    );

  }


  if(
    map.getZoom()>=
    LABEL_MIN_ZOOM
  ){

    if(
      document.getElementById(
        'spOn'
      ).checked
    ){

      spLabels.addTo(
        map
      );

    }


    if(
      document.getElementById(
        'trOn'
      ).checked
    ){

      trLabels.addTo(
        map
      );

    }

  }

}


/* =====================================================
   DRAW POINT
===================================================== */

async function loadAndDraw(
  kind,
  x,
  y
){

  const features=
    await getTile(
      kind,
      x,
      y
    );


  if(
    !features.length
  )
    return;


  const isSP=
    kind.startsWith(
      'sp_'
    );


  const pointLayer=
    isSP
      ? spL
      : trL;


  const labelLayer=
    isSP
      ? spLabels
      : trLabels;


  const b=
    map.getBounds();


  const showLabels=
    map.getZoom()>=
    LABEL_MIN_ZOOM;


  for(
    const f of features
  ){

    if(

      !f.geometry ||

      f.geometry.type!==
      'Point'

    )
      continue;


    const [
      lng,
      lat
    ]=
      f.geometry.coordinates;


    if(
      !b.contains(
        [lat,lng]
      )
    )
      continue;


    const p=
      f.properties || {};


    const color=
      isSP
        ? 'red'
        : '#06f';


    const m=
      L.circleMarker(

        [lat,lng],

        {

          pane:
            'pointPane',

          radius:
            isSP
              ? 3
              : 2.5,

          color:
            color,

          fillColor:
            color,

          fillOpacity:
            1,

          weight:
            .6

        }

      );


    m.bindPopup(

      attributePopup(

        isSP,

        p,

        lat,

        lng

      ),

      {
        maxWidth:380
      }

    );


    m.addTo(
      pointLayer
    );


    if(showLabels){

      const line=
        String(
          p.Line ?? ''
        );


      const num=
        isSP
          ? p.Sp
          : p.Tr;


      const labelText=

        isSP

          ? `${esc(line)} SP ${esc(String(num??''))}`

          : `${esc(line)} TRAS ${esc(String(num??''))}`;


      const odd=
        isOddLine(
          line
        );


      let icon;


      if(odd){

        icon=
          L.divIcon({

            className:'',

            html:

              `<div class="point-label ${
                isSP
                  ? 'spLabel'
                  : 'trLabel'
              } odd">
                ${labelText}
              </div>`,

            iconSize:null,

            iconAnchor:[
              5,
              -8
            ]

          });

      }else{

        icon=
          L.divIcon({

            className:'',

            html:

              `<div class="point-label ${
                isSP
                  ? 'spLabel'
                  : 'trLabel'
              } even">
                ${labelText}
              </div>`,

            iconSize:null,

            iconAnchor:[
              -5,
              7
            ]

          });

      }


      L.marker(

        [lat,lng],

        {

          pane:
            'labelPane',

          icon:
            icon,

          interactive:
            false

        }

      ).addTo(
        labelLayer
      );

    }

  }

}


/* =====================================================
   POPUP
===================================================== */

function attributePopup(
  isSP,
  p,
  lat,
  lng
){

  let h=

    `<b>${
      isSP
        ? '🔴 SP'
        : '🔵 TRAS'
    }</b>

    <table class="at">`;


  Object.keys(p).forEach(

    k=>{

      h+=

        `<tr>
          <td>${esc(k)}</td>
          <td>${esc(String(p[k]??''))}</td>
        </tr>`;

    }

  );


  h+=

    `<tr>
      <td>Latitude</td>
      <td>${lat.toFixed(7)}</td>
    </tr>`;


  h+=

    `<tr>
      <td>Longitude</td>
      <td>${lng.toFixed(7)}</td>
    </tr>`;


  h+=
    '</table>';


  return h;

}


/* =====================================================
   ODD / EVEN
===================================================== */

function isOddLine(
  line
){

  const m=
    String(line)
      .match(
        /(\d+)\s*$/
      );


  if(!m)
    return false;


  return(

    parseInt(
      m[1],
      10
    )%2===1

  );

}


/* =====================================================
   TOGGLE LINE
===================================================== */

function toggleLine(k){

  const l=
    k==='src'
      ? src
      : rec;


  const id=
    k==='src'
      ? 'srcOn'
      : 'recOn';


  if(
    document.getElementById(
      id
    ).checked
  ){

    l.addTo(
      map
    );


    if(k==='rec'){

      updateReceiverLabels();

    }

  }else{

    map.removeLayer(
      l
    );


    if(k==='rec'){

      map.removeLayer(
        receiverLabels
      );

    }

  }

}


/* =====================================================
   BASEMAP
===================================================== */

function base(k){

  [
    sat,
    road,
    hyb

  ].forEach(

    x=>{

      if(
        map.hasLayer(x)
      ){

        map.removeLayer(
          x
        );

      }

    }

  );


  ({
    sat,
    road,
    hyb

  }[k]).addTo(
    map
  );

}


/* =====================================================
   PANEL
===================================================== */

function op(b){

  b.parentElement
    .classList
    .toggle(
      'open'
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function esc(s){

  return String(s)
    .replace(

      /[&<>"']/g,

      m=>({

        '&':'&amp;',

        '<':'&lt;',

        '>':'&gt;',

        '"':'&quot;',

        "'":'&#039;'

      }[m])

    );

}


/* =====================================================
   STATUS
===================================================== */

function updateStatus(){

  const z=
    map.getZoom();


  const el=
    document.getElementById(
      'status'
    );


  if(
    z<POINT_MIN_ZOOM
  ){

    el.textContent=
      `Zoom ${z} — zoom in untuk SP/TRAS`;

  }

  else if(
    z<LABEL_MIN_ZOOM
  ){

    el.textContent=
      `Zoom ${z} — titik aktif, label muncul mulai zoom ${LABEL_MIN_ZOOM}`;

  }

  else{

    el.textContent=
      `Zoom ${z} — hanya tile pada area tampilan yang dimuat`;

  }

}


/* =====================================================
   LOCATE
===================================================== */

function locate(){

  if(
    !navigator.geolocation
  ){

    alert(
      'Browser tidak mendukung GPS/lokasi.'
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    p=>{

      map.setView(

        [

          p.coords.latitude,

          p.coords.longitude

        ],

        18

      );

    },


    ()=>{

      alert(
        'Izin lokasi tidak tersedia. Silakan izinkan lokasi untuk website ini.'
      );

    },


    {

      enableHighAccuracy:true,

      timeout:10000,

      maximumAge:0

    }

  );

}


/* =====================================================
   START
===================================================== */

init();

</script>
