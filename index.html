<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LAMTURO GIS</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
}

/* =========================
   LOGO
========================= */

.logo-box {
    position: absolute;
    z-index: 1000;
    top: 15px;
    left: 15px;
    background: white;
    border-radius: 12px;
    padding: 8px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    display: flex;
    align-items: center;
    gap: 8px;
}

.logo-box img {
    width: 42px;
    height: auto;
}

.logo-title {
    font-size: 18px;
    font-weight: bold;
    color: #16456b;
}

.logo-subtitle {
    font-size: 10px;
    color: #16456b;
    margin-top: 2px;
}

/* =========================
   LABEL DASAR
========================= */

.point-label {
    pointer-events: none;
    white-space: nowrap;
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    line-height: 14px;
    padding: 1px 3px;
    background: white;
    border: 1px solid #1677ff;
    color: #0066cc;
    border-radius: 2px;
    box-sizing: border-box;
}

/* =========================
   LABEL GENAP
   horizontal
========================= */

.even-label-wrap {
    position: relative;
    width: max-content;
    height: 16px;
}

.even-label-dot {
    position: absolute;
    left: -8px;
    top: 4px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #087cff;
}

.even-label {
    margin-left: 2px;
}

/* =========================
   LABEL GANJIL
   TITIK DI ATAS
   LABEL VERTIKAL KE BAWAH
========================= */

.odd-label-wrap {
    position: relative;
    width: 20px;
    height: 105px;
    pointer-events: none;
}

/*
   Titik tetap berada di bagian paling atas.
*/
.odd-label-dot {
    position: absolute;
    left: 7px;
    top: 0px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #087cff;
    z-index: 10;
}

/*
   Label awalnya horizontal:
       R113 TRAS 2305

   kemudian diputar 90 derajat.
   Titik tetap berada di atas label.
*/
.odd-label {
    position: absolute;
    left: 10px;
    top: 11px;

    white-space: nowrap;

    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    line-height: 14px;

    padding: 2px 4px;

    background: white;
    border: 1px solid #1677ff;
    color: #0066cc;
    border-radius: 2px;

    transform: rotate(90deg);
    transform-origin: top left;

    box-sizing: border-box;
}

/* =========================
   SP
========================= */

.sp-even-dot {
    background: red !important;
}

.sp-odd-dot {
    background: red !important;
}

.sp-label {
    border-color: red !important;
    color: red !important;
}

/* =========================
   LAYER CONTROL
========================= */

.leaflet-control-layers {
    border-radius: 10px !important;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
}

.leaflet-control-layers-expanded {
    padding: 10px;
}

/* =========================
   POSISI SAYA
========================= */

.location-button {
    background: white;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
}

.location-button:hover {
    background: #f2f2f2;
}

/* =========================
   ZOOM INFO
========================= */

.zoom-info {
    position: absolute;
    bottom: 10px;
    left: 10px;
    z-index: 1000;
    background: rgba(255,255,255,.9);
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 11px;
}
</style>
</head>

<body>

<div id="map"></div>

<!-- =========================
     LOGO
========================= -->

<div class="logo-box">
    <img src="logo.png">
    <div>
        <div class="logo-title">LAMTURO GIS</div>
        <div class="logo-subtitle">WEB GIS SEISMIK 2D</div>
    </div>
</div>

<div id="zoomInfo" class="zoom-info">
    Zoom 10
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {
    zoomControl: true,
    preferCanvas: true,
    maxZoom: 20
}).setView([-7.2, 112.4], 10);


/* =========================================================
   BASEMAP
========================================================= */

const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        maxZoom: 20,
        attribution: "Tiles © Esri"
    }
);

const hybrid = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/" +
    "World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        maxZoom: 20,
        attribution: "Tiles © Esri"
    }
);

const roadmap = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 20,
        attribution: "© OpenStreetMap contributors"
    }
);

satellite.addTo(map);


/* =========================================================
   PANE ORDER
========================================================= */

map.createPane("receiverPane");
map.getPane("receiverPane").style.zIndex = 400;

map.createPane("sourcePane");
map.getPane("sourcePane").style.zIndex = 500;

map.createPane("trasPane");
map.getPane("trasPane").style.zIndex = 550;

map.createPane("spPane");
map.getPane("spPane").style.zIndex = 600;


/* =========================================================
   SOURCE LINE
========================================================= */

let sourceLayer = null;

fetch("east_source_line.geojson")
.then(response => response.json())
.then(data => {

    sourceLayer = L.geoJSON(data, {
        pane: "sourcePane",
        style: {
            color: "red",
            weight: 2.5,
            opacity: 1
        }
    });

})
.catch(err => {
    console.log("Source line tidak ditemukan:", err);
});


/* =========================================================
   RECEIVER LINE
========================================================= */

let receiverLayer = null;

fetch("east_receiver_line.geojson")
.then(response => response.json())
.then(data => {

    receiverLayer = L.geoJSON(data, {
        pane: "receiverPane",
        style: {
            color: "blue",
            weight: 2.5,
            opacity: 1
        }
    });

})
.catch(err => {
    console.log("Receiver line tidak ditemukan:", err);
});


/* =========================================================
   TILE SYSTEM
=========================================================

   Struktur:

   tiles/
      sp_1/
         X/
            Y/
               data.geojson

      sp_2/
         X/
            Y/
               data.geojson

      tras_1/
         X/
            Y/
               data.geojson

      tras_2/
         X/
            Y/
               data.geojson

   Grid index:
      X = floor(longitude * 50)
      Y = floor(latitude  * 50)

========================================================= */

const TILE_SCALE = 50;

const TILE_TYPES = [
    {
        name: "tras_1",
        type: "tras",
        color: "blue"
    },
    {
        name: "tras_2",
        type: "tras",
        color: "blue"
    },
    {
        name: "sp_1",
        type: "sp",
        color: "red"
    },
    {
        name: "sp_2",
        type: "sp",
        color: "red"
    }
];


/* =========================================================
   LAYER GROUP
========================================================= */

const trasLayer = L.layerGroup();
const spLayer = L.layerGroup();


/* =========================================================
   CACHE
========================================================= */

const loadedTiles = new Set();

const tileDataCache = new Map();


/* =========================================================
   PROPERTY SEARCH
========================================================= */

function getProperties(feature) {

    if (!feature || !feature.properties) {
        return {};
    }

    return feature.properties;
}


/* =========================================================
   FIND VALUE
========================================================= */

function findProperty(properties, keywords) {

    const keys = Object.keys(properties);

    for (const keyword of keywords) {

        const exact = keys.find(
            k => k.toLowerCase() === keyword.toLowerCase()
        );

        if (exact !== undefined) {
            return properties[exact];
        }
    }

    for (const keyword of keywords) {

        const found = keys.find(
            k => k.toLowerCase().includes(keyword.toLowerCase())
        );

        if (found !== undefined) {
            return properties[found];
        }
    }

    return null;
}


/* =========================================================
   LINE NAME
========================================================= */

function getLineName(properties) {

    let value = findProperty(
        properties,
        [
            "R",
            "LINE",
            "Line",
            "LINE_NAME",
            "LINE_NO",
            "LINTASAN",
            "RECEIVER",
            "SOURCE"
        ]
    );

    if (value !== null && value !== undefined && value !== "") {

        let text = String(value).trim();

        /*
           Kalau sudah R113 / S113
        */
        if (/^[RS]\s*\d+$/i.test(text)) {
            return text.toUpperCase().replace(/\s+/g, "");
        }

        /*
           Kalau hanya angka
        */
        if (/^\d+$/.test(text)) {

            return "R" + text;
        }

        /*
           Cari Rxxx / Sxxx di dalam text
        */
        const match = text.match(/[RS]\s*\d+/i);

        if (match) {
            return match[0]
                .toUpperCase()
                .replace(/\s+/g, "");
        }
    }


    /*
       Cari langsung dari semua property
    */

    for (const key of Object.keys(properties)) {

        const valueText = String(properties[key]);

        const match = valueText.match(/[RS]\s*\d+/i);

        if (match) {

            return match[0]
                .toUpperCase()
                .replace(/\s+/g, "");
        }
    }

    return "";
}


/* =========================================================
   LINE NUMBER
========================================================= */

function getLineNumber(lineName) {

    if (!lineName) {
        return null;
    }

    const match = String(lineName).match(/\d+/);

    if (!match) {
        return null;
    }

    return parseInt(match[0], 10);
}


/* =========================================================
   STATION / TRAS / SP
========================================================= */

function getStation(properties, type) {

    let value;

    if (type === "tras") {

        value = findProperty(
            properties,
            [
                "TRAS",
                "TRAS_NO",
                "TRASNUM",
                "STATION",
                "STA",
                "POINT",
                "NO"
            ]
        );

    } else {

        value = findProperty(
            properties,
            [
                "SP",
                "SP_NO",
                "SHOT",
                "SHOTPOINT",
                "STATION",
                "STA",
                "POINT",
                "NO"
            ]
        );

    }

    if (
        value !== null &&
        value !== undefined &&
        value !== ""
    ) {
        return String(value);
    }

    return "";
}


/* =========================================================
   LABEL TEXT
========================================================= */

function makeLabel(feature, type) {

    const properties = getProperties(feature);

    const lineName = getLineName(properties);

    const station = getStation(
        properties,
        type
    );

    if (!lineName && !station) {
        return "";
    }

    if (type === "sp") {

        return `${lineName} SP ${station}`.trim();

    }

    return `${lineName} TRAS ${station}`.trim();
}


/* =========================================================
   IS ODD
========================================================= */

function isOddLine(lineName) {

    const number = getLineNumber(lineName);

    if (number === null) {
        return false;
    }

    return number % 2 === 1;
}


/* =========================================================
   LABEL ICON
========================================================= */

function makePointIcon(
    label,
    color,
    odd,
    type
) {

    if (!label) {
        return null;
    }

    /*
       ================================
       LINTASAN GANJIL
       ================================

       Titik berada di atas.
       Label diputar 90° ke bawah.
    */

    if (odd) {

        return L.divIcon({

            className: "",

            html: `
                <div class="odd-label-wrap">

                    <div
                        class="odd-label-dot
                        ${type === "sp" ? "sp-odd-dot" : ""}"
                        style="background:${color};">
                    </div>

                    <div
                        class="odd-label
                        ${type === "sp" ? "sp-label" : ""}">
                        ${label}
                    </div>

                </div>
            `,

            iconSize: [20, 105],

            /*
               Titik berada tepat pada koordinat.
            */
            iconAnchor: [10, 0]
        });

    }


    /*
       ================================
       LINTASAN GENAP
       ================================
    */

    return L.divIcon({

        className: "",

        html: `
            <div class="even-label-wrap">

                <div
                    class="even-label-dot
                    ${type === "sp" ? "sp-even-dot" : ""}"
                    style="background:${color};">
                </div>

                <div
                    class="point-label
                    ${type === "sp" ? "sp-label" : ""}">
                    ${label}
                </div>

            </div>
        `,

        iconSize: [120, 18],

        /*
           Titik menjadi anchor.
        */
        iconAnchor: [0, 8]
    });
}


/* =========================================================
   POINT STYLE
========================================================= */

function createPointFeature(
    feature,
    type,
    color
) {

    const properties = getProperties(feature);

    const label = makeLabel(
        feature,
        type
    );

    const lineName = getLineName(
        properties
    );

    const odd = isOddLine(
        lineName
    );

    /*
       Jangan tampilkan label kalau zoom terlalu rendah.
    */

    let marker;

    if (label) {

        marker = L.geoJSON(
            feature,
            {

                pane:
                    type === "sp"
                    ? "spPane"
                    : "trasPane",

                pointToLayer:
                    function(
                        feature,
                        latlng
                    ) {

                        return L.marker(
                            latlng,
                            {
                                icon:
                                    makePointIcon(
                                        label,
                                        color,
                                        odd,
                                        type
                                    ),
                                keyboard: false,
                                interactive: true
                            }
                        );
                    },

                onEachFeature:
                    function(
                        feature,
                        layer
                    ) {

                        let html =
                            "<b>" +
                            label +
                            "</b><br><br>";

                        for (
                            const key
                            of Object.keys(
                                properties
                            )
                        ) {

                            html +=
                                "<b>" +
                                key +
                                ":</b> " +
                                properties[key] +
                                "<br>";
                        }

                        layer.bindPopup(
                            html
                        );
                    }
            }
        );

    } else {

        marker = L.geoJSON(
            feature,
            {

                pane:
                    type === "sp"
                    ? "spPane"
                    : "trasPane",

                pointToLayer:
                    function(
                        feature,
                        latlng
                    ) {

                        return L.circleMarker(
                            latlng,
                            {
                                radius: 4,
                                color: color,
                                fillColor: color,
                                fillOpacity: 1,
                                weight: 1
                            }
                        );
                    },

                onEachFeature:
                    function(
                        feature,
                        layer
                    ) {

                        let html = "";

                        for (
                            const key
                            of Object.keys(
                                properties
                            )
                        ) {

                            html +=
                                "<b>" +
                                key +
                                ":</b> " +
                                properties[key] +
                                "<br>";
                        }

                        layer.bindPopup(
                            html
                        );
                    }
            }
        );
    }

    return marker;
}


/* =========================================================
   LOAD TILE
========================================================= */

async function loadTile(
    tileType,
    x,
    y
) {

    const cacheKey =
        `${tileType.name}/${x}/${y}`;

    if (
        loadedTiles.has(cacheKey)
    ) {
        return;
    }

    loadedTiles.add(cacheKey);

    const url =
        `tiles/${tileType.name}/${x}/${y}/data.geojson`;

    try {

        const response =
            await fetch(url);

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        tileDataCache.set(
            cacheKey,
            data
        );

        if (
            !data ||
            !data.features
        ) {
            return;
        }

        for (
            const feature
            of data.features
        ) {

            /*
               Pastikan hanya Point
            */

            if (
                !feature.geometry ||
                feature.geometry.type !== "Point"
            ) {
                continue;
            }

            const layer =
                createPointFeature(
                    feature,
                    tileType.type,
                    tileType.color
                );

            if (
                tileType.type === "sp"
            ) {

                spLayer.addLayer(
                    layer
                );

            } else {

                trasLayer.addLayer(
                    layer
                );
            }
        }

        /*
           Label hanya ditampilkan
           pada zoom >= 16.
        */

        updateVisibility();

    } catch (error) {

        /*
           File tile yang tidak ada
           sengaja diabaikan.
        */

    }
}


/* =========================================================
   LOAD VISIBLE TILES
========================================================= */

let loadingTimer = null;

function loadVisibleTiles() {

    const zoom =
        map.getZoom();

    /*
       Jangan load titik terlalu awal.
    */

    if (zoom < 16) {
        return;
    }

    const bounds =
        map.getBounds();

    let minX =
        Math.floor(
            bounds.getWest() *
            TILE_SCALE
        );

    let maxX =
        Math.floor(
            bounds.getEast() *
            TILE_SCALE
        );

    let minY =
        Math.floor(
            bounds.getSouth() *
            TILE_SCALE
        );

    let maxY =
        Math.floor(
            bounds.getNorth() *
            TILE_SCALE
        );


    /*
       Batasi jumlah tile yang
       dimuat sekaligus agar browser
       tidak terlalu berat.
    */

    const MAX_TILES = 100;

    let count = 0;


    for (
        let x = minX;
        x <= maxX;
        x++
    ) {

        for (
            let y = minY;
            y <= maxY;
            y++
        ) {

            if (
                count >= MAX_TILES
            ) {
                return;
            }

            for (
                const tileType
                of TILE_TYPES
            ) {

                loadTile(
                    tileType,
                    x,
                    y
                );
            }

            count++;
        }
    }
}


/* =========================================================
   VISIBILITY
========================================================= */

function updateVisibility() {

    const zoom =
        map.getZoom();

    const showPoints =
        zoom >= 16;

    const showLabels =
        zoom >= 17;


    if (
        showPoints &&
        !map.hasLayer(trasLayer)
    ) {

        trasLayer.addTo(map);

    }

    if (
        showPoints &&
        !map.hasLayer(spLayer)
    ) {

        spLayer.addTo(map);

    }


    /*
       Pada zoom rendah,
       hide layer supaya ringan.
    */

    if (!showPoints) {

        if (
            map.hasLayer(
                trasLayer
            )
        ) {

            map.removeLayer(
                trasLayer
            );
        }

        if (
            map.hasLayer(
                spLayer
            )
        ) {

            map.removeLayer(
                spLayer
            );
        }
    }


    /*
       Tampilkan / sembunyikan label
       berdasarkan zoom.
    */

    document
        .querySelectorAll(
            ".odd-label, .even-label"
        )
        .forEach(
            el => {

                el.style.display =
                    showLabels
                    ? ""
                    : "none";
            }
        );
}


/* =========================================================
   DEBOUNCED LOAD
========================================================= */

function scheduleTileLoad() {

    clearTimeout(
        loadingTimer
    );

    loadingTimer =
        setTimeout(
            function() {

                loadVisibleTiles();

                updateVisibility();

            },
            300
        );
}


/* =========================================================
   MAP EVENTS
========================================================= */

map.on(
    "moveend",
    scheduleTileLoad
);

map.on(
    "zoomend",
    function() {

        document
            .getElementById(
                "zoomInfo"
            )
            .innerHTML =
                "Zoom " +
                map.getZoom();

        scheduleTileLoad();
        updateVisibility();
    }
);


/* =========================================================
   INITIAL
========================================================= */

document
    .getElementById(
        "zoomInfo"
    )
    .innerHTML =
        "Zoom " +
        map.getZoom();


/* =========================================================
   LAYER CONTROL
========================================================= */

const overlays = {

    "Source Line":
        sourceLayer,

    "Receiver Line":
        receiverLayer,

    "East SP":
        spLayer,

    "East TRAS":
        trasLayer
};

const baseMaps = {

    "🛰️ SATELLITE":
        satellite,

    "🗺️ ROADMAP":
        roadmap,

    "🛰️ HYBRID":
        hybrid
};

L.control.layers(
    baseMaps,
    overlays,
    {
        collapsed: false,
        position: "topright"
    }
).addTo(map);


/* =========================================================
   POSISI SAYA
========================================================= */

const LocationControl =
    L.Control.extend({

        options: {
            position: "topright"
        },

        onAdd: function() {

            const div =
                L.DomUtil.create(
                    "div"
                );

            div.innerHTML =
                `
                <button
                    class="location-button"
                    onclick="goToMyLocation()">
                    📍 POSISI SAYA
                </button>
                `;

            L.DomEvent.disableClickPropagation(
                div
            );

            return div;
        }
    });

map.addControl(
    new LocationControl()
);


/* =========================================================
   POSISI SAYA
========================================================= */

function goToMyLocation() {

    if (
        !navigator.geolocation
    ) {

        alert(
            "Browser tidak mendukung GPS."
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;

            map.setView(
                [lat, lon],
                18
            );

            L.marker(
                [lat, lon]
            )
            .addTo(map)
            .bindPopup(
                `
                <b>POSISI SAYA</b><br>
                Latitude: ${lat.toFixed(7)}<br>
                Longitude: ${lon.toFixed(7)}
                `
            )
            .openPopup();

        },

        function(error) {

            alert(
                "Posisi tidak dapat diperoleh."
            );

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}


/* =========================================================
   LOAD SOURCE / RECEIVER
========================================================= */

setTimeout(
    function() {

        if (
            sourceLayer
        ) {

            sourceLayer.addTo(
                map
            );
        }

        if (
            receiverLayer
        ) {

            receiverLayer.addTo(
                map
            );
        }

    },
    1000
);

</script>

</body>
</html>
