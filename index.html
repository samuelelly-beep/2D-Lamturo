<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Lamturo GIS</title>

<script
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtUgo1bsWsw0XXlDNvReYeCwohPiDc79w&callback=initMap"
async
defer>
</script>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#map{
    width:100%;
    height:100%;
}


/* =========================
   HEADER
========================= */

#header{
    position:absolute;
    top:15px;
    left:15px;
    z-index:1000;

    display:flex;
    align-items:center;

    background:white;
    padding:8px 15px 8px 8px;

    border-radius:10px;

    box-shadow:0 2px 10px rgba(0,0,0,.25);
}

#header img{
    width:55px;
    height:55px;
    object-fit:contain;
    margin-right:10px;
}

#header-title{
    font-size:20px;
    font-weight:bold;
    color:#12345a;
}

#header-subtitle{
    font-size:12px;
    color:#4a8f45;
    margin-top:3px;
}


/* =========================
   CONTROL PANEL
========================= */

.control-box{

    background:white;

    padding:10px;

    margin:8px;

    border-radius:10px;

    box-shadow:0 2px 10px rgba(0,0,0,.25);

    min-width:190px;
}

.control-title{

    font-size:14px;

    font-weight:bold;

    color:#12345a;

    padding-bottom:6px;

    border-bottom:1px solid #ddd;

    margin-bottom:6px;

}

.control-button{

    display:block;

    width:100%;

    padding:8px;

    margin:4px 0;

    border:1px solid #ccc;

    border-radius:6px;

    background:white;

    cursor:pointer;

    text-align:left;

    font-size:13px;
}

.control-button:hover{
    background:#f1f5f9;
}


/* =========================
   LAYER CHECKBOX
========================= */

.layer-row{

    display:flex;

    align-items:center;

    gap:7px;

    padding:6px 2px;

    font-size:13px;

}

.layer-symbol{

    width:12px;
    height:12px;

    border-radius:50%;

    display:inline-block;
}

.source-symbol{
    background:red;
}

.receiver-symbol{
    background:#2979d7;
}

.sp-symbol{
    background:red;
    border:1px solid #8b0000;
}

.tras-symbol{
    background:#0066cc;
    border:1px solid #003b73;
}


/* =========================
   POPUP
========================= */

.info-window{

    min-width:220px;

    max-width:320px;

    font-size:13px;
}

.info-title{

    font-size:16px;

    font-weight:bold;

    margin-bottom:8px;

}

.attribute-table{

    border-collapse:collapse;

    width:100%;
}

.attribute-table td{

    border-bottom:1px solid #ddd;

    padding:4px 5px;

    vertical-align:top;

}

.attribute-table td:first-child{

    font-weight:bold;

    color:#555;

    width:40%;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #header{

        top:8px;
        left:8px;

        padding:5px 9px 5px 5px;

    }

    #header img{

        width:42px;
        height:42px;

    }

    #header-title{

        font-size:16px;

    }

    #header-subtitle{

        font-size:9px;

    }

    .control-box{

        min-width:150px;

        margin:4px;

        padding:7px;

    }

    .control-button{

        padding:7px;

        font-size:12px;

    }

    .layer-row{

        font-size:12px;

        padding:5px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div id="header">

    <img src="logo.png">

    <div>

        <div id="header-title">
            LAMTURO GIS
        </div>

        <div id="header-subtitle">
            WEB GIS SEISMIK 2D
        </div>

    </div>

</div>


<div id="map"></div>


<script>


/* =====================================================
   GLOBAL
===================================================== */

let map;

let sourceLayer;

let receiverLayer;

let spLayer;

let trasLayer;

let sourceData = null;

let receiverData = null;

let spData = null;

let trasData = null;

let infoWindow;


/* =====================================================
   SETTINGS
===================================================== */

/*
   Titik baru mulai ditampilkan pada zoom ini.
*/

const POINT_MIN_ZOOM = 12;


/*
   Jumlah maksimum titik yang dirender.
   Ini penting supaya HP tidak berat.
*/

const MAX_SP_POINTS = 6000;

const MAX_TRAS_POINTS = 10000;


/* =====================================================
   INIT MAP
===================================================== */

function initMap(){

    map = new google.maps.Map(
        document.getElementById("map"),
        {

            center:{
                lat:-7.25,
                lng:112.75
            },

            zoom:9,

            mapTypeId:"hybrid",

            mapTypeControl:false,

            fullscreenControl:true,

            streetViewControl:false,

            gestureHandling:"greedy"

        }
    );


    infoWindow = new google.maps.InfoWindow();


    /* =========================
       LINE LAYERS
    ========================= */

    sourceLayer =
        new google.maps.Data();

    receiverLayer =
        new google.maps.Data();


    sourceLayer.setStyle({

        strokeColor:"#ff0000",

        strokeOpacity:0.9,

        strokeWeight:2,

        zIndex:10

    });


    receiverLayer.setStyle({

        strokeColor:"#003f9e",

        strokeOpacity:0.9,

        strokeWeight:2,

        zIndex:5

    });


    sourceLayer.setMap(map);

    receiverLayer.setMap(map);


    /* =========================
       POINT LAYERS
    ========================= */

    trasLayer =
        new google.maps.Data();

    spLayer =
        new google.maps.Data();


    /*
       TRAS berada di bawah SP
    */

    trasLayer.setStyle({

        icon:{
            path:google.maps.SymbolPath.CIRCLE,

            scale:3,

            fillColor:"#0066cc",

            fillOpacity:1,

            strokeColor:"#003b73",

            strokeWeight:0.6
        },

        zIndex:20

    });


    /*
       SP berada paling atas
    */

    spLayer.setStyle({

        icon:{
            path:google.maps.SymbolPath.CIRCLE,

            scale:3.5,

            fillColor:"#ff0000",

            fillOpacity:1,

            strokeColor:"#8b0000",

            strokeWeight:0.8
        },

        zIndex:30

    });


    /*
       Default OFF
    */

    spLayer.setMap(null);

    trasLayer.setMap(null);


    /* =========================
       LOAD LINE
    ========================= */

    loadGeoJSON(
        "east_source_line.geojson",
        sourceLayer
    );

    loadGeoJSON(
        "east_receiver_line.geojson",
        receiverLayer
    );


    /* =========================
       LOAD POINT DATA
    ========================= */

    fetch("east_sp.geojson")
        .then(response => response.json())
        .then(data => {

            spData = data;

            updatePoints();

        })
        .catch(error =>
            console.error(
                "SP gagal dimuat:",
                error
            )
        );


    fetch("east_tras.geojson")
        .then(response => response.json())
        .then(data => {

            trasData = data;

            updatePoints();

        })
        .catch(error =>
            console.error(
                "TRAS gagal dimuat:",
                error
            )
        );


    /* =========================
       CLICK SP
    ========================= */

    spLayer.addListener(
        "click",
        function(event){

            showFeatureInfo(
                event.feature,
                "SP"
            );

        }
    );


    /* =========================
       CLICK TRAS
    ========================= */

    trasLayer.addListener(
        "click",
        function(event){

            showFeatureInfo(
                event.feature,
                "TRAS"
            );

        }
    );


    /* =========================
       CLICK LINE
    ========================= */

    sourceLayer.addListener(
        "click",
        function(event){

            showFeatureInfo(
                event.feature,
                "SOURCE LINE"
            );

        }
    );


    receiverLayer.addListener(
        "click",
        function(event){

            showFeatureInfo(
                event.feature,
                "RECEIVER LINE"
            );

        }
    );


    /* =========================
       UPDATE SAAT MAP BERGERAK
    ========================= */

    map.addListener(
        "idle",
        function(){

            updatePoints();

        }
    );


    /* =========================
       CONTROLS
    ========================= */

    createLayerControl();

    createBasemapControl();

    createLocationControl();

}


/* =====================================================
   LOAD GEOJSON LINE
===================================================== */

function loadGeoJSON(
    filename,
    layer
){

    fetch(filename)

        .then(response => {

            if(!response.ok){

                throw new Error(
                    filename +
                    " tidak ditemukan"
                );

            }

            return response.json();

        })

        .then(data => {

            layer.addGeoJson(data);

        })

        .catch(error => {

            console.error(error);

        });

}


/* =====================================================
   UPDATE POINTS
===================================================== */

function updatePoints(){

    /*
       Jangan tampilkan titik pada zoom kecil.
    */

    if(
        map.getZoom() <
        POINT_MIN_ZOOM
    ){

        clearPointLayers();

        return;

    }


    const bounds =
        map.getBounds();


    if(!bounds){

        return;

    }


    /*
       Render SP
    */

    if(
        spLayer.getMap() !== null &&
        spData
    ){

        renderPoints(
            spData,
            spLayer,
            MAX_SP_POINTS
        );

    }


    /*
       Render TRAS
    */

    if(
        trasLayer.getMap() !== null &&
        trasData
    ){

        renderPoints(
            trasData,
            trasLayer,
            MAX_TRAS_POINTS
        );

    }

}


/* =====================================================
   RENDER POINTS SESUAI EXTENT
===================================================== */

function renderPoints(
    geojson,
    layer,
    maxPoints
){

    layer.forEach(
        function(feature){

            layer.remove(feature);

        }
    );


    if(
        !geojson ||
        !geojson.features
    ){

        return;

    }


    const bounds =
        map.getBounds();


    const features =
        geojson.features;


    let selected = [];


    /*
       Ambil hanya titik
       yang berada di extent map.
    */

    for(
        let i=0;
        i<features.length;
        i++
    ){

        const feature =
            features[i];


        if(
            !feature.geometry ||
            feature.geometry.type !== "Point"
        ){

            continue;

        }


        const coordinates =
            feature.geometry.coordinates;


        const lng =
            Number(coordinates[0]);

        const lat =
            Number(coordinates[1]);


        if(
            isNaN(lat) ||
            isNaN(lng)
        ){

            continue;

        }


        const position =
            new google.maps.LatLng(
                lat,
                lng
            );


        if(
            bounds.contains(position)
        ){

            selected.push(feature);

        }

    }


    /*
       Kalau terlalu banyak,
       ambil sampling.
    */

    if(
        selected.length >
        maxPoints
    ){

        const step =
            selected.length /
            maxPoints;

        const sampled = [];

        for(
            let i=0;
            i<maxPoints;
            i++
        ){

            sampled.push(
                selected[
                    Math.floor(i*step)
                ]
            );

        }

        selected = sampled;

    }


    /*
       Masukkan hanya titik yang
       terlihat di layar.
    */

    if(selected.length){

        layer.addGeoJson({

            type:"FeatureCollection",

            features:selected

        });

    }

}


/* =====================================================
   CLEAR POINT
===================================================== */

function clearPointLayers(){

    spLayer.forEach(
        function(feature){

            spLayer.remove(feature);

        }
    );


    trasLayer.forEach(
        function(feature){

            trasLayer.remove(feature);

        }
    );

}


/* =====================================================
   FEATURE INFORMATION
===================================================== */

function showFeatureInfo(
    feature,
    title
){

    let html =
        '<div class="info-window">';


    html +=
        '<div class="info-title">' +
        title +
        '</div>';


    html +=
        '<table class="attribute-table">';


    feature.forEachProperty(
        function(value,key){

            if(
                value === null ||
                value === undefined ||
                value === ""
            ){

                return;

            }


            html +=
                "<tr>" +

                "<td>" +
                escapeHTML(key) +
                "</td>" +

                "<td>" +
                escapeHTML(String(value)) +
                "</td>" +

                "</tr>";

        }
    );


    /*
       Tambahkan koordinat untuk titik.
    */

    const geometry =
        feature.getGeometry();


    if(
        geometry &&
        geometry.getType() === "Point"
    ){

        const position =
            geometry.get();


        html +=
            "<tr>" +

            "<td>Latitude</td>" +

            "<td>" +
            position.lat().toFixed(7) +
            "</td>" +

            "</tr>";


        html +=
            "<tr>" +

            "<td>Longitude</td>" +

            "<td>" +
            position.lng().toFixed(7) +
            "</td>" +

            "</tr>";

    }


    html +=
        "</table></div>";


    infoWindow.setContent(html);


    /*
       Untuk Data Layer,
       posisi klik digunakan.
    */

    if(
        geometry &&
        geometry.getType() === "Point"
    ){

        infoWindow.setPosition(
            geometry.get()
        );

    }else{

        infoWindow.setPosition(
            map.getCenter()
        );

    }


    infoWindow.open(map);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return value
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   LAYER CONTROL
===================================================== */

function createLayerControl(){

    const box =
        document.createElement("div");

    box.className =
        "control-box";


    const title =
        document.createElement("div");

    title.className =
        "control-title";

    title.innerHTML =
        "🗺️ LAYERS";

    box.appendChild(title);


    /*
       Source
    */

    createLayerCheckbox(
        box,
        "Source Line",
        sourceLayer,
        true,
        "source-symbol"
    );


    /*
       Receiver
    */

    createLayerCheckbox(
        box,
        "Receiver Line",
        receiverLayer,
        true,
        "receiver-symbol"
    );


    /*
       SP
    */

    createLayerCheckbox(
        box,
        "SP",
        spLayer,
        false,
        "sp-symbol"
    );


    /*
       TRAS
    */

    createLayerCheckbox(
        box,
        "TRAS",
        trasLayer,
        false,
        "tras-symbol"
    );


    map.controls[
        google.maps.ControlPosition.TOP_RIGHT
    ].push(box);

}


/* =====================================================
   CHECKBOX
===================================================== */

function createLayerCheckbox(
    parent,
    label,
    layer,
    checked,
    symbolClass
){

    const row =
        document.createElement("label");

    row.className =
        "layer-row";


    const checkbox =
        document.createElement("input");

    checkbox.type =
        "checkbox";

    checkbox.checked =
        checked;


    const symbol =
        document.createElement("span");

    symbol.className =
        "layer-symbol " +
        symbolClass;


    const text =
        document.createElement("span");

    text.innerHTML =
        label;


    row.appendChild(checkbox);

    row.appendChild(symbol);

    row.appendChild(text);


    checkbox.addEventListener(
        "change",
        function(){

            if(
                checkbox.checked
            ){

                layer.setMap(map);

                updatePoints();

            }else{

                layer.setMap(null);

            }

        }
    );


    parent.appendChild(row);

}


/* =====================================================
   BASEMAP CONTROL
===================================================== */

function createBasemapControl(){

    const box =
        document.createElement("div");

    box.className =
        "control-box";


    const title =
        document.createElement("div");

    title.className =
        "control-title";

    title.innerHTML =
        "🗺️ BASEMAP";

    box.appendChild(title);


    createMapButton(
        box,
        "🛰️ Google Satellite",
        "satellite"
    );


    createMapButton(
        box,
        "🌍 Google Hybrid",
        "hybrid"
    );


    createMapButton(
        box,
        "🗺️ Google Roadmap",
        "roadmap"
    );


    createMapButton(
        box,
        "⛰️ Google Terrain",
        "terrain"
    );


    map.controls[
        google.maps.ControlPosition.TOP_RIGHT
    ].push(box);

}


/* =====================================================
   MAP BUTTON
===================================================== */

function createMapButton(
    parent,
    text,
    mapType
){

    const button =
        document.createElement("button");

    button.className =
        "control-button";

    button.innerHTML =
        text;


    button.onclick =
        function(){

            map.setMapTypeId(
                mapType
            );

        };


    parent.appendChild(button);

}


/* =====================================================
   CURRENT LOCATION
===================================================== */

function createLocationControl(){

    const box =
        document.createElement("div");

    box.className =
        "control-box";


    const title =
        document.createElement("div");

    title.className =
        "control-title";

    title.innerHTML =
        "📍 POSISI SAYA";

    box.appendChild(title);


    const button =
        document.createElement("button");

    button.className =
        "control-button";

    button.innerHTML =
        "📍 Tampilkan Posisi Saya";


    button.onclick =
        function(){

            if(
                !navigator.geolocation
            ){

                alert(
                    "Browser tidak mendukung GPS."
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                function(position){

                    const location =
                        {

                            lat:
                                position.coords.latitude,

                            lng:
                                position.coords.longitude

                        };


                    map.setCenter(
                        location
                    );


                    map.setZoom(17);


                    new google.maps.Marker({

                        position:location,

                        map:map,

                        title:"Posisi Saya"

                    });

                },


                function(error){

                    alert(
                        "Posisi tidak dapat diperoleh. Pastikan izin lokasi browser sudah diberikan."
                    );

                },

                {

                    enableHighAccuracy:true,

                    timeout:10000,

                    maximumAge:0

                }

            );

        };


    box.appendChild(button);


    map.controls[
        google.maps.ControlPosition.TOP_RIGHT
    ].push(box);

}


</script>

</body>

</html>
