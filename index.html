<!doctype html>
<html lang="id">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Lamturo GIS</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html,body,#map{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
}

/* HEADER */

#head{
    position:absolute;
    z-index:1000;
    left:60px;
    top:8px;
    background:#fff;
    padding:5px 9px;
    border-radius:9px;
    box-shadow:0 2px 8px #0004;
    display:flex;
    align-items:center;
}

#head img{
    width:42px;
    height:42px;
    object-fit:contain;
    margin-right:7px;
}

#t{
    font-weight:bold;
    color:#12345a;
    font-size:16px;
}

#s{
    font-size:9px;
    color:#4a8f45;
}

/* CONTROL */

#ctl{
    position:absolute;
    z-index:1000;
    right:8px;
    top:8px;
    width:155px;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.p{
    background:#fff;
    border-radius:8px;
    box-shadow:0 2px 8px #0004;
    overflow:hidden;
}

.h{
    border:0;
    background:#fff;
    width:100%;
    padding:9px;
    text-align:left;
    font-weight:bold;
    color:#12345a;
    cursor:pointer;
}

.c{
    display:none;
    padding:6px;
    border-top:1px solid #ddd;
}

.p.open .c{
    display:block;
}

.r{
    display:flex;
    align-items:center;
    gap:6px;
    padding:5px 1px;
    font-size:11px;
}

.ln{
    display:inline-block;
    width:22px;
    height:3px;
}

.src{
    background:red;
}

.rec{
    background:#003f9e;
}

.pt{
    width:11px;
    height:11px;
    border-radius:50%;
    display:inline-block;
}

.sp{
    background:red;
}

.tr{
    background:#06f;
}

.b{
    width:100%;
    padding:6px;
    margin-bottom:4px;
    background:white;
    border:1px solid #ccc;
    border-radius:5px;
    text-align:left;
    font-size:11px;
    cursor:pointer;
}

/* POPUP */

.at{
    border-collapse:collapse;
    font-size:12px;
}

.at td{
    padding:4px;
    border-bottom:1px solid #ddd;
    vertical-align:top;
}

.at td:first-child{
    font-weight:bold;
    color:#555;
}

.leaflet-popup-content{
    max-height:330px;
    overflow:auto;
}

/* LABEL */

.sp-label{
    background:#fff;
    border:1px solid red;
    color:red;
    font-weight:bold;
    font-size:10px;
    padding:1px 4px;
    border-radius:3px;
    box-shadow:0 1px 3px #0005;
    white-space:nowrap;
}

.tras-label{
    background:#fff;
    border:1px solid #06f;
    color:#06f;
    font-weight:bold;
    font-size:10px;
    padding:1px 4px;
    border-radius:3px;
    box-shadow:0 1px 3px #0005;
    white-space:nowrap;
}

/* LINTASAN GANJIL ROTASI 90 */

.sp-vertical{
    transform:rotate(90deg);
    transform-origin:center center;
}

.tras-vertical{
    transform:rotate(90deg);
    transform-origin:center center;
}

.leaflet-tooltip:before{
    display:none;
}

/* MOBILE */

@media(max-width:600px){

    #ctl{
        width:145px;
    }

    #head{
        left:55px;
    }

    #t{
        font-size:14px;
    }

    #head img{
        width:37px;
        height:37px;
    }

    .sp-label,
    .tras-label{
        font-size:9px;
        padding:1px 3px;
    }

}

</style>

</head>

<body>

<div id="head">

<img src="logo.png">

<div>

<div id="t">
LAMTURO GIS
</div>

<div id="s">
WEB GIS SEISMIK 2D
</div>

</div>

</div>

<div id="map"></div>

<div id="ctl">

<!-- LAYERS -->

<div class="p">

<button class="h" onclick="op(this)">
📚 LAYERS ▼
</button>

<div class="c">

<label class="r">

<input
id="srcOn"
type="checkbox"
checked
onchange="line('src')">

<span class="ln src"></span>

Source Line

</label>


<label class="r">

<input
id="recOn"
type="checkbox"
checked
onchange="line('rec')">

<span class="ln rec"></span>

Receiver Line

</label>


<label class="r">

<input
id="spOn"
type="checkbox"
onchange="points()">

<span class="pt sp"></span>

East SP

</label>


<label class="r">

<input
id="trOn"
type="checkbox"
onchange="points()">

<span class="pt tr"></span>

East TRAS

</label>

</div>

</div>


<!-- BASEMAP -->

<div class="p">

<button class="h" onclick="op(this)">
🗺️ BASEMAP ▼
</button>

<div class="c">

<button class="b" onclick="base('sat')">
🛰️ Satellite
</button>

<button class="b" onclick="base('hyb')">
🌍 Hybrid
</button>

<button class="b" onclick="base('road')">
🗺️ Roadmap
</button>

</div>

</div>


<!-- POSISI -->

<div class="p">

<button class="h" onclick="locate()">
📍 POSISI SAYA
</button>

</div>

</div>


<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const GRID_SIZE = 0.02;

/*
   SP/TRAS hanya aktif pada zoom 20+
*/

const POINT_MIN_ZOOM = 20;

const LABEL_MIN_ZOOM = 20;


/* =====================================================
   VARIABEL
===================================================== */

let map;

let src;
let rec;

let spL;
let trL;

let sat;
let road;
let hyb;

let loadedTiles = new Map();


/* =====================================================
   INIT
===================================================== */

function init(){

    map =
        L.map('map')
        .setView(
            [-7.2,112.4],
            10
        );


    /* PANES */

    map.createPane('rec');
    map.getPane('rec').style.zIndex = 400;

    map.createPane('src');
    map.getPane('src').style.zIndex = 450;

    map.createPane('tr');
    map.getPane('tr').style.zIndex = 500;

    map.createPane('sp');
    map.getPane('sp').style.zIndex = 550;


    /* ESRI */

    sat =
        L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                attribution:'Tiles © Esri'
            }
        )
        .addTo(map);


    /* OSM */

    road =
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution:'© OpenStreetMap'
            }
        );


    /* HYBRID */

    const labels =
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                opacity:.25,
                attribution:'© OpenStreetMap'
            }
        );

    hyb =
        L.layerGroup([
            sat,
            labels
        ]);


    /* SOURCE */

    src =
        L.geoJSON(
            null,
            {
                pane:'src',
                style:{
                    color:'red',
                    weight:2
                }
            }
        )
        .addTo(map);


    /* RECEIVER */

    rec =
        L.geoJSON(
            null,
            {
                pane:'rec',
                style:{
                    color:'#003f9e',
                    weight:1.5
                }
            }
        )
        .addTo(map);


    spL = L.layerGroup();

    trL = L.layerGroup();


    /* SOURCE FILE */

    fetch('east_source_line.geojson')
    .then(r => r.json())
    .then(d => src.addData(d))
    .catch(e => console.warn('Source Line:',e));


    /* RECEIVER FILE */

    fetch('east_receiver_line.geojson')
    .then(r => r.json())
    .then(d => rec.addData(d))
    .catch(e => console.warn('Receiver Line:',e));


    /* UPDATE POINTS */

    map.on('moveend',updatePoints);

    map.on('zoomend',updatePoints);

}


/* =====================================================
   EXTENT TILE
===================================================== */

function tileIndex(value){

    return Math.floor(value / GRID_SIZE);

}


/* =====================================================
   TILE RANGE
===================================================== */

function visibleTiles(){

    const b =
        map.getBounds();


    const minX =
        tileIndex(
            b.getWest()
        );


    const maxX =
        tileIndex(
            b.getEast()
        );


    const minY =
        tileIndex(
            b.getSouth()
        );


    const maxY =
        tileIndex(
            b.getNorth()
        );


    const result=[];


    /*
       Batasi jumlah grid
       untuk mencegah request
       terlalu banyak
    */

    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let y=minY;
            y<=maxY;
            y++
        ){

            result.push(
                [x,y]
            );

        }

    }


    return result;

}


/* =====================================================
   LOAD TILE
===================================================== */

async function loadTile(
    source,
    x,
    y
){

    const key =
        source +
        '/' +
        x +
        '/' +
        y;


    if(
        loadedTiles.has(key)
    ){

        return loadedTiles.get(key);

    }


    const url =
        'tiles/' +
        source +
        '/' +
        x +
        '/' +
        y +
        '/data.geojson';


    try{

        const response =
            await fetch(url);


        if(!response.ok){

            loadedTiles.set(
                key,
                []
            );

            return [];

        }


        const data =
            await response.json();


        const features =
            data.features || [];


        loadedTiles.set(
            key,
            features
        );


        return features;

    }

    catch(e){

        console.warn(
            'Tile error:',
            url
        );

        loadedTiles.set(
            key,
            []
        );

        return [];

    }

}


/* =====================================================
   UPDATE POINTS
===================================================== */

async function updatePoints(){

    /*
       Hapus titik lama
    */

    spL.clearLayers();

    trL.clearLayers();


    /*
       Belum cukup zoom
    */

    if(
        map.getZoom() < POINT_MIN_ZOOM
    ){

        map.removeLayer(spL);

        map.removeLayer(trL);

        return;

    }


    const tiles =
        visibleTiles();


    /*
       SP
    */

    if(
        document
        .getElementById('spOn')
        .checked
    ){

        for(
            const [x,y]
            of tiles
        ){

            const features =
                await loadTile(
                    'sp_1',
                    x,
                    y
                );


            features.forEach(
                f => addPoint(
                    spL,
                    f,
                    'sp'
                )
            );


            const features2 =
                await loadTile(
                    'sp_2',
                    x,
                    y
                );


            features2.forEach(
                f => addPoint(
                    spL,
                    f,
                    'sp'
                )
            );

        }


        spL.addTo(map);

    }

    else{

        map.removeLayer(spL);

    }


    /*
       TRAS
    */

    if(
        document
        .getElementById('trOn')
        .checked
    ){

        for(
            const [x,y]
            of tiles
        ){

            const features =
                await loadTile(
                    'tras_1',
                    x,
                    y
                );


            features.forEach(
                f => addPoint(
                    trL,
                    f,
                    'tr'
                )
            );


            const features2 =
                await loadTile(
                    'tras_2',
                    x,
                    y
                );


            features2.forEach(
                f => addPoint(
                    trL,
                    f,
                    'tr'
                )
            );

        }


        trL.addTo(map);

    }

    else{

        map.removeLayer(trL);

    }

}


/* =====================================================
   CHECK ODD LINE
===================================================== */

function isOddLine(lineValue){

    if(!lineValue)
        return false;


    const match =
        String(lineValue)
        .match(/\d+/);


    if(!match)
        return false;


    const number =
        parseInt(
            match[0],
            10
        );


    return number % 2 !== 0;

}


/* =====================================================
   ADD POINT
===================================================== */

function addPoint(
    layer,
    f,
    type
){

    if(
        !f.geometry ||
        f.geometry.type !== 'Point'
    ){

        return;

    }


    const c =
        f.geometry.coordinates;


    const x =
        Number(c[0]);


    const y =
        Number(c[1]);


    /*
       HANYA TITIK DALAM EXTENT
    */

    if(
        !map
        .getBounds()
        .contains([y,x])
    ){

        return;

    }


    const p =
        f.properties || {};


    /* LINE */

    const lineValue =
        p.Line !== undefined
            ? String(p.Line)
            : '';


    /* SP */

    const spValue =
        p.Sp !== undefined
            ? String(p.Sp)
            : '';


    /* TRAS */

    const trValue =
        p.Tr !== undefined
            ? String(p.Tr)
            : '';


    /* LABEL */

    let label='';


    if(type === 'sp'){

        label =
            lineValue +
            (spValue
                ? '<br>SP ' + spValue
                : '');

    }


    if(type === 'tr'){

        label =
            lineValue +
            (trValue
                ? '<br>TRAS ' + trValue
                : '');

    }


    if(!label){

        label =
            type === 'sp'
                ? 'SP'
                : 'TRAS';

    }


    /* MARKER */

    const marker =
        L.circleMarker(
            [y,x],
            {

                pane:
                    type === 'sp'
                        ? 'sp'
                        : 'tr',

                radius:
                    type === 'sp'
                        ? 3.2
                        : 2.7,

                color:
                    type === 'sp'
                        ? 'red'
                        : '#06f',

                fillColor:
                    type === 'sp'
                        ? 'red'
                        : '#06f',

                fillOpacity:1,

                weight:.7

            }
        );


    /* =================================================
       SEMUA ATRIBUT
    ================================================= */

    let html =

        '<b>' +

        (
            type === 'sp'
                ? '🔴 SP'
                : '🔵 TRAS'
        ) +

        '</b>' +

        '<table class="at">';


    Object.keys(p)
        .forEach(
            key => {

                const value =
                    p[key] ?? '';


                html +=

                    '<tr>' +

                    '<td>' +

                    esc(key) +

                    '</td>' +

                    '<td>' +

                    esc(
                        String(value)
                    ) +

                    '</td>' +

                    '</tr>';

            }
        );


    html +=

        '<tr>' +

        '<td>Latitude</td>' +

        '<td>' +

        y.toFixed(7) +

        '</td>' +

        '</tr>';


    html +=

        '<tr>' +

        '<td>Longitude</td>' +

        '<td>' +

        x.toFixed(7) +

        '</td>' +

        '</tr>';


    html +=
        '</table>';


    marker.bindPopup(
        html,
        {
            maxWidth:340
        }
    );


    /* =================================================
       LABEL
    ================================================= */

    if(
        map.getZoom() >=
        LABEL_MIN_ZOOM
    ){

        const odd =
            isOddLine(
                lineValue
            );


        marker.bindTooltip(

            label,

            {

                permanent:true,

                direction:'right',

                offset:[
                    5,
                    0
                ],

                opacity:.95,

                className:

                    type === 'sp'

                        ? (
                            odd
                                ? 'sp-label sp-vertical'
                                : 'sp-label'
                        )

                        : (

                            odd
                                ? 'tras-label tras-vertical'
                                : 'tras-label'
                        )

            }

        );

    }


    marker.addTo(layer);

}


/* =====================================================
   LINE TOGGLE
===================================================== */

function line(k){

    const layer =
        k === 'src'
            ? src
            : rec;


    const checkbox =
        document.getElementById(
            k === 'src'
                ? 'srcOn'
                : 'recOn'
        );


    if(
        checkbox.checked
    ){

        layer.addTo(map);

    }

    else{

        map.removeLayer(layer);

    }

}


/* =====================================================
   BASEMAP
===================================================== */

function base(k){

    map.removeLayer(sat);

    map.removeLayer(hyb);

    map.removeLayer(road);


    if(k === 'sat')
        sat.addTo(map);


    if(k === 'hyb')
        hyb.addTo(map);


    if(k === 'road')
        road.addTo(map);

}


/* =====================================================
   MENU
===================================================== */

function op(b){

    b.parentElement
     .classList
     .toggle('open');

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(s){

    return String(s)
        .replace(
            /[&<>"']/g,

            m => ({

                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#039;'

            }[m])

        );

}


/* =====================================================
   POSISI SAYA
===================================================== */

let myLocationMarker = null;

let myAccuracyCircle = null;


function locate(){

    if(
        !navigator.geolocation
    ){

        alert(
            'Browser tidak mendukung GPS/lokasi.'
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            const lat =
                position.coords.latitude;


            const lng =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;


            const pos =
                [lat,lng];


            if(myLocationMarker)
                map.removeLayer(
                    myLocationMarker
                );


            if(myAccuracyCircle)
                map.removeLayer(
                    myAccuracyCircle
                );


            myAccuracyCircle =
                L.circle(
                    pos,
                    {

                        radius:accuracy,

                        color:'#0066ff',

                        weight:1,

                        fillColor:'#0066ff',

                        fillOpacity:.12

                    }
                )
                .addTo(map);


            myLocationMarker =
                L.circleMarker(
                    pos,
                    {

                        radius:8,

                        color:'#fff',

                        weight:3,

                        fillColor:'#0066ff',

                        fillOpacity:1

                    }
                )
                .addTo(map);


            myLocationMarker
                .bindPopup(

                    '<b>📍 POSISI SAYA</b>' +

                    '<br><br>' +

                    'Latitude: ' +

                    lat.toFixed(7) +

                    '<br>' +

                    'Longitude: ' +

                    lng.toFixed(7) +

                    '<br>' +

                    'Akurasi: ±' +

                    accuracy.toFixed(1) +

                    ' m'

                )
                .openPopup();


            map.setView(
                pos,
                20
            );


            /*
               Setelah zoom ke posisi,
               load tile area tersebut
            */

            setTimeout(
                updatePoints,
                300
            );

        },


        function(error){

            let message =
                'Posisi tidak dapat diperoleh.';


            if(error.code === 1)
                message =
                    'Izin lokasi ditolak. Silakan izinkan lokasi pada browser.';


            if(error.code === 2)
                message =
                    'Posisi GPS tidak tersedia.';


            if(error.code === 3)
                message =
                    'Pengambilan posisi GPS timeout.';


            alert(message);

        },


        {

            enableHighAccuracy:true,

            timeout:15000,

            maximumAge:0

        }

    );

}


/* =====================================================
   START
===================================================== */

init();

</script>

</body>

</html>
